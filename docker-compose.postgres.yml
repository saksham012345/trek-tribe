version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=trektribe
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-trek-tribe-postgres-pass}
      - POSTGRES_DB=trektribe
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trektribe -d trektribe"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
