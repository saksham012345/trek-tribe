<!doctype html>
<html lang="en">

<script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  ::-webkit-scrollbar{width:8px;height:8px}

<body class="bg-nature-100 text-nature-900 font-sans text-[15px] antialiased">

<div class="flex min-h-screen">

  <!-- ================= SIDEBAR ================= -->
  <aside id="sidebar" class="w-64 shrink-0 bg-white border-r border-nature-200 flex flex-col fixed inset-y-0 left-0 z-40 -translate-x-full lg:translate-x-0 transition-transform">
    <div class="h-16 flex items-center gap-2.5 px-5 border-b border-nature-200">
      <div class="w-8 h-8 rounded-lg bg-forest-600 text-white grid place-items-center font-bold">T</div>
      <div class="leading-tight">
        <div class="font-semibold text-sm">TrekTribe</div>
        <div class="text-[11px] text-nature-500">Organizer OS</div>
      </div>
    </div>

    <nav id="nav" class="flex-1 overflow-y-auto py-4 px-3 space-y-5 text-sm"></nav>

    <div class="p-3 border-t border-nature-200">
      <div class="rounded-lg bg-forest-50 border border-forest-200 p-3">
        <div class="flex items-center justify-between">
          <span class="text-[11px] font-semibold uppercase tracking-wide text-forest-700">Professional</span>
          <span class="text-[11px] text-forest-600">renews 12 Sep</span>

          <div class="h-full bg-forest-600" style="width:62%"></div>
        </div>
        <p class="mt-1.5 text-[11px] text-forest-700">8 of 13 trips used this cycle</p>
        <a href="#billing" class="mt-2.5 block text-center text-xs font-semibold text-white bg-forest-600 hover:bg-forest-700 rounded-md py-1.5">Manage plan</a>
      </div>
    </div>
  </aside>

  <!-- ================= MAIN ================= -->
  <div class="flex-1 lg:pl-64 min-w-0">

    <header class="h-16 bg-white/90 backdrop-blur border-b border-nature-200 sticky top-0 z-30 flex items-center gap-3 px-4 sm:px-6">
      <button id="menuBtn" class="lg:hidden p-2 -ml-2 rounded-md hover:bg-nature-100" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>

      <div class="min-w-0">
        <h1 id="pageTitle" class="font-semibold truncate">Dashboard</h1>
        <p id="pageSub" class="text-xs text-nature-500 truncate">—</p>
      </div>

      <div class="ml-auto flex items-center gap-2">
        <div class="hidden md:flex items-center gap-2 bg-nature-100 rounded-md px-3 h-9 w-64">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-nature-400"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input placeholder="Search trips, leads, vendors…" class="bg-transparent text-sm outline-none w-full placeholder:text-nature-400" />
        </div>
        <!-- role switcher: demonstrates FR-17 / NFR-6 gating live -->
        <label class="hidden sm:flex items-center gap-1.5 text-xs text-nature-500">
          <span class="uppercase tracking-wide">Role</span>
          <select id="roleSel" class="h-9 rounded-md border border-nature-300 bg-white px-2 text-sm text-nature-800">
            <option value="owner">Owner</option>
            <option value="operations">Operations</option>
            <option value="finance">Finance</option>
            <option value="marketing">Marketing</option>
            <option value="trip_leader">Trip leader</option>
          </select>
        </label>
        <button class="relative p-2 rounded-md hover:bg-nature-100" aria-label="Notifications">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-red-500 ring-2 ring-white"></span>
        </button>
        <div class="flex items-center gap-2 pl-2 border-l border-nature-200">
          <div class="w-8 h-8 rounded-full bg-forest-600 text-white grid place-items-center text-xs font-semibold">DO</div>
          <div class="hidden sm:block leading-tight">
            <div class="text-xs font-semibold">Demo Organizer</div>
            <div class="text-[11px] text-nature-500">Verified</div>
          </div>
        </div>
      </div>
    </header>

    <main id="view" class="p-4 sm:p-6 max-w-[1500px]"></main>
  </div>
</div>

<!-- backdrop for mobile sidebar -->
<div id="backdrop" class="fixed inset-0 bg-nature-900/40 z-30 lg:hidden" hidden></div>

<!-- modal -->
<div id="modal" class="fixed inset-0 z-50 grid place-items-center p-4" hidden>
  <div class="absolute inset-0 bg-nature-900/50" data-close></div>
  <div class="relative bg-white rounded-xl shadow-xl w-full max-w-lg max-h-[85vh] overflow-auto">
    <div class="flex items-center justify-between px-5 py-4 border-b border-nature-200">
      <h3 id="modalTitle" class="font-semibold">Title</h3>
      <button data-close class="p-1.5 rounded-md hover:bg-nature-100" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="modalBody" class="p-5"></div>
  </div>
</div>

<!-- toast -->
<div id="toast" class="fixed bottom-5 right-5 z-50 bg-nature-900 text-white text-sm px-4 py-2.5 rounded-lg shadow-lg" hidden></div>

<script>
/* =======================================================================
   TrekTribe Organizer OS — clickable HTML template
   Hash-routed single file. Every screen maps to real backend modules:
     crm, vendors, vendorAssignments, vendorCommunications, finance,
     bookings, paymentVerification, subscriptions, analytics, customTrips,
     reviews, trips, bankDetails/autoPay, organizer
   Replace the MOCK objects with API calls when porting to React.
   ======================================================================= */
'use strict';

/* ---------------- nav definition ---------------- */

   matrix. Areas marked ASSUMED are not named in that matrix; see V.team's

/* Rule 46(b): unique + consecutive per financial year. '2526' = FY2025-26. */
function financialYear(d){
  const y = d.getFullYear(), startY = d.getMonth() >= 3 ? y : y - 1;   // FY starts April
  return String(startY % 100).padStart(2,'0') + String((startY+1) % 100).padStart(2,'0');
}
function nextInvoiceNumber(shortCode, fy){
  const c = STORE.get('counters', {});
  c[fy] = (c[fy] || 0) + 1;                     // per-FY counter, resets each FY
  STORE.set('counters', c);
  return `${shortCode}/${fy}/${String(c[fy]).padStart(5,'0')}`;   // 15 chars ≤ Rule 46(b) cap of 16
}

/* gross_5pct → 5% of the full package, no ITC.
   margin_18pct → 18% of the operator's margin only (CGST Rule 33).
   Intra-state splits CGST+SGST; inter-state is IGST. Exactly one applies. */
function computeTax({ scheme, gross, margin, placeOfSupply, homeState }){
  const taxable = scheme === 'gross_5pct' ? gross : margin;
  const rate    = scheme === 'gross_5pct' ? 5 : 18;
  const tax     = Math.round(taxable * rate) / 100;
  const intra   = placeOfSupply === homeState;
  return {
    taxable, rate,
    cgst: intra ? Math.round(tax*50)/100 : 0,
    sgst: intra ? Math.round(tax*50)/100 : 0,
    igst: intra ? 0 : tax,
    tax,
    // under the margin scheme the traveller still pays the gross package; tax sits on the margin
    total: Math.round((gross + tax) * 100) / 100,
    intra,
  };
}

/* status is DERIVED on read from dates + counts — the spec is explicit that it
   is not a separately-maintained flag, to avoid a denormalized value going stale */
function couponStatus(c){
  const now = Date.now();
  if (c.max_total_redemptions != null && c.total_redeemed >= c.max_total_redemptions) return 'exhausted';
  if (c.ends_at   && c.ends_at   < now) return 'expired';
  if (c.starts_at && c.starts_at > now) return 'inactive';
  return 'active';
}

/* real eligibility + discount computation, incl. the percentage cap */
function applyCoupon(c, booking, isFirstBooking){
  const st = couponStatus(c);
  if (st !== 'active') return { ok:false, reason:`Coupon is ${st}` };
  if (c.trip_id && c.trip_id !== booking.trip) return { ok:false, reason:`Only valid on ${c.trip_id}` };
  if (c.min_booking_amount && booking.amount < c.min_booking_amount)
    return { ok:false, reason:`Needs a booking of at least ${INR(c.min_booking_amount)}` };
  if (c.first_booking_only && !isFirstBooking) return { ok:false, reason:'First booking only' };

  let d = c.discount_type === 'percentage' ? booking.amount * c.value / 100 : c.value;
  let capped = false;
  if (c.discount_type === 'percentage' && c.max_discount_amount != null && d > c.max_discount_amount){
    d = c.max_discount_amount; capped = true;
  }
  d = Math.min(d, booking.amount);
  return { ok:true, discount:round2(d), payable:round2(booking.amount - d), capped };
}

/* Decision D6 (2026-08-22): coupons STACK. An all-trips coupon and a trip-specific
   coupon that both match one booking both apply, and their discounts add.

   Every percentage is taken off the ORIGINAL amount, not off the running balance.
   Two 15% coupons therefore come to 30%, not 27.75%. Compounding off a shrinking
   base is defensible arithmetic, but it is not what "both apply" means to the
   person who set the coupons up, and the difference stays invisible until someone
   reconciles a payout.

   Guards are not re-implemented here — each code goes through applyCoupon, so
   expiry, trip scope, minimum amount and first-booking rules stay in exactly one
   place and cannot drift between the single and stacked paths.

   NOTE: there is deliberately no cap on the total. A floor is a pricing decision
   (O1) and nobody has set one. `pct` is returned so the UI can show how far the
   stack has gone rather than letting it be discovered later. */
function applyCoupons(codes, booking, isFirstBooking){
  const seen = new Set();
  const lines = (codes || []).map(code => {
    const c = MOCK.coupons.find(x => x.code === code);
    if (!c)            return { code, ok:false, reason:'No such code' };
    if (seen.has(code)) return { code, ok:false, reason:'Already applied' };
    seen.add(code);
    const r = applyCoupon(c, booking, isFirstBooking);
    return { code, scope: c.trip_id ? c.trip_id : 'All trips', ...r };
  });

  const raw = lines.filter(l => l.ok).reduce((s,l) => s + l.discount, 0);
  /* Never return a negative price, however many codes are thrown at it. */
  const totalDiscount = round2(Math.min(raw, booking.amount));
  /* `floored` means the traveller pays nothing because the discounts met or
     exceeded the booking — NOT `raw > amount`. applyCoupon already clamps each
     individual discount to the booking value, so a single oversized coupon
     arrives here already reduced and `raw > amount` would never fire for it.
     Caught by the Sprint 2 suite. */
  return {
    lines,
    totalDiscount,
    net: round2(booking.amount - totalDiscount),
    floored: booking.amount > 0 && totalDiscount >= booking.amount,
    pct: booking.amount ? Math.round(totalDiscount / booking.amount * 1000) / 10 : 0,
  };
}

    status:'failed',    scheduled_at:Date.now()-20*DAY, recipients:340, sent:0,   failed:340, optout:0 },

MOCK.marketingEvents = [

  { type:'referral_completed',     when:Date.now()-5*3600e3,  processed:true },

  { type:'review_request_due',     when:Date.now()-30*60e3,   processed:false },
];

/* ---- G-07 · payout tranches ----
   advance gross = round(total * 0.6, 2); balance gross = total − advance
   (the REMAINDER, not an independently computed 40%) so the two rows always
   sum to exactly total_amount with no rounding drift. Commission splits by
   the identical direct/remainder technique. net is gross − commission. */
function buildPayouts(booking, tripStart, capturedAt){
  const pct = commissionPct('demo-org');
  const total = booking.amount;
  const advGross = round2(total * 0.6);
  const balGross = round2(total - advGross);
  const totalComm = round2(total * pct / 100);
  const advComm = round2(totalComm * 0.6);
  const balComm = round2(totalComm - advComm);
  const mk = (tranche, gross, comm, due, status) => ({
    booking_id:booking.id, trip:booking.trip, tranche,
    commission_pct_applied:pct, gross_amount:gross, commission_amount:comm,
    net_amount:round2(gross - comm), due_at:due, status,
  });
  return [
    mk('advance', advGross, advComm, capturedAt + DAY, booking.pay === 'Verified' ? 'completed' : 'pending'),
    mk('balance', balGross, balComm, tripStart, tripStart < Date.now() ? 'pending' : 'pending'),
  ];
}
function allPayouts(){
  const starts = { 'Zanskar Traverse':Date.now()+30*DAY, 'Kashmir Great Lakes':Date.now()+55*DAY,
                   'Goecha La':Date.now()+140*DAY, 'Markha Valley':Date.now()+80*DAY, 'Hampta Pass':Date.now()+110*DAY };
  const out = [];
  MOCK.bookings.filter(b => b.pay !== 'Refunded').forEach(b => {
    out.push(...buildPayouts(b, starts[b.trip] || Date.now()+60*DAY, Date.now()-10*DAY));
  });
  // one KYC-blocked and one voided example so the wider status enum is visible
  if (out[3]) out[3].status = 'kyc_blocked';
  if (out[5]) out[5].status = 'initiated';
  return out;
}

/* ---- G-11 · cash flow: cash in (payments) vs cash out (expenses + vendor payments) ---- */
function cashFlow(){
  const months = ['Feb','Mar','Apr','May','Jun','Jul'];
  const inn  = [220000, 310000, 285000, 402000, 596000, 284000];
  // current month's cash out is derived from the real records, per NFR-3: the
  // same vendor payments and expenses rows the other screens read, not a copy
  const vendorPaid = MOCK.assignments.reduce((s,a)=>s+a.paid, 0);
  const expenses   = MOCK.expenses.reduce((s,e)=>s+e.amt, 0);
  const out = [140000, 190000, 205000, 268000, 331000, vendorPaid + expenses];
  return months.map((m,i)=>({ month:m, in:inn[i], out:out[i], net:round2(inn[i]-out[i]) }));
}

/* firing a trigger writes ONE outbox row, then fans out one log row per
   assigned vendor — the same outbox → worker → log pipeline as the spec */
function fireVendorEvent(eventType, tripName){
  const trip = MOCK.trips.find(t=>t.name===tripName) || { name:tripName, dep:'—', seats:'0/0' };
  const ctx = { trip:tripName, dep:trip.dep, pax:(trip.seats||'0/0').split('/')[0] };
  const assigned = MOCK.assignments.filter(a=>a.trip===tripName);
  if (!assigned.length) return { ok:false, reason:'No vendors are assigned to '+tripName };

  STORE.set('vendorOutbox', vendorOutbox().concat({
    id:'ve'+Date.now(), trip:tripName, event_type:eventType, created:Date.now(), processed:Date.now(),
  }));
  const rendered = VENDOR_EVENTS[eventType].body(ctx);
  const rows = assigned.map((a,i)=>({
    id:'vc'+Date.now()+'-'+i, trip:tripName, vendor:a.vendor, event_type:eventType,
    sent_at:Date.now(), status:'sent',
    snapshot:rendered,       // frozen at send time so a later template change never alters a resend
  }));
  STORE.set('vendorComms', vendorComms().concat(rows));
  return { ok:true, count:rows.length, vendors:assigned.map(a=>a.vendor) };
}

/* ==========================================================================
   P2 · G-01/02/03 — trip templates, recurring series, lifecycle + duplicate
   Spec: 2026-08-05-core-platform-organizer-auth-design.md
     `trip_templates`  — id, organizer_id, name, title, destination,
                         description, itinerary, price, duration_days,
                         inclusions, exclusions
     `trip_series`     — id, organizer_id, series_name, title, destination,
                         description, itinerary, base_price, template_id?
     `trips` ALTER     — status enum, publish_at, series_id, template_id,
                         duplicated_from_trip_id
   A template is never customer-visible and never bookable. A series is a
   recipe; only the departures it stamps out are real, sellable trips.
   ========================================================================== */

const TRIP_STATUS = ['draft','scheduled','published'];   // spec enum, verbatim

/* Trips move into STORE here so publish / schedule / duplicate actually mutate
   state instead of re-rendering a constant. Seeded from MOCK.trips so every
   other screen keeps reading the same departures it always did. */
function seedTrips(){
  const dest = { 'TRIP.01':'Zanskar, Ladakh', 'TRIP.02':'Kashmir', 'TRIP.03':'Sikkim',
                 'TRIP.04':'Himachal',        'TRIP.05':'Ladakh' };
  /* max_participants is nullable per the booking spec. TRIP.03 deliberately has
     no cap so v_occupancy_by_trip's "capacity data unavailable" branch is
     reachable rather than theoretical. */
  const cap  = { 'TRIP.01':8, 'TRIP.02':8, 'TRIP.03':null, 'TRIP.04':8, 'TRIP.05':8 };
  /* Departures are placed relative to today, not on fixed calendar dates. A
     hard-coded 2026 date silently turns every trip "Past" once that date
     passes, which is how a demo quietly stops demonstrating anything. */
  const inDays = { 'TRIP.01':30, 'TRIP.02':55, 'TRIP.03':121, 'TRIP.04':38, 'TRIP.05':14 };
  return MOCK.trips.map(t => {
    const start = Date.now() + inDays[t.code]*DAY;
    return {
    id:t.code, code:t.code, name:t.name, dep:DATE_IN(start), days:t.days,
    seats:t.seats, fill:t.fill, price:t.price,
    destination:dest[t.code], start_date:start,
    max_participants:cap[t.code],
    status: t.status === 'Draft' ? 'draft' : 'published',
    publish_at:null, series_id:null, template_id:null, duplicated_from_trip_id:null,
    }; }).concat(pastDepartures());
}

/* Last season's departures. A 2025 Markha run is a DIFFERENT trip from the 2026
   one, not the same row seen twice — modelling it as one would let a closed
   season's bookings count against this season's seats. */
function pastDepartures(){
  return [
    { id:'TRIP.P1', code:'TRIP.P1', name:'Markha Valley',       ago:371, days:9,
      seats:'8/8', fill:100, price:96000,  destination:'Ladakh' },
    { id:'TRIP.P2', code:'TRIP.P2', name:'Hampta Pass',         ago:410, days:5,
      seats:'8/8', fill:100, price:18500,  destination:'Himachal' },
    { id:'TRIP.P3', code:'TRIP.P3', name:'Goecha La',           ago:303, days:11,
      seats:'6/8', fill:75,  price:109000, destination:'Sikkim' },
    { id:'TRIP.P4', code:'TRIP.P4', name:'Kashmir Great Lakes', ago:422, days:8,
      seats:'7/8', fill:88,  price:74000,  destination:'Kashmir' },
  ].map(t => {
    const start = Date.now() - t.ago*DAY;
    return { ...t, start_date:start, dep:DATE_IN(start), max_participants:8, past:true,
             status:'published', publish_at:null,
             series_id:null, template_id:null, duplicated_from_trip_id:null };
  });
}
function tripRows(){
  let r = STORE.get('trips', null);
  if (!r) { r = seedTrips(); STORE.set('trips', r); }
  return r;
}
const setTrips = rows => STORE.set('trips', rows);

/* A scheduled trip whose publish_at has passed IS published — derived on read,
   so there is no cron job whose failure could leave the flag stale. */
function effectiveStatus(t){
  return (t.status === 'scheduled' && t.publish_at && t.publish_at <= Date.now())
    ? 'published' : t.status;
}
/* Lifecycle status and sell state are two different axes. 'Full'/'Selling' is
   derived from seat fill; keeping it out of the status column stops the two
   meanings collapsing into one field. */
const hasDeparted = t => t.start_date < Date.now();

/* Seats sold and fill are DERIVED from bookings, not stored on the trip. The
   seeded pair used to disagree with the bookings behind it (an "8/8 Full"
   departure carrying one 2-seat booking), and a stored count is exactly the
   kind of field that drifts the moment a booking is cancelled. */
const confirmedSeats = tripId => analyticsBookings()
  .filter(b => b.trip_id===tripId && b.status==='confirmed')
  .reduce((s,b) => s + (b.pax || 1), 0);
const seatsLabel = t => confirmedSeats(t.id) + '/' + (t.max_participants ?? '—');
const fillPct = t => t.max_participants
  ? Math.min(100, Math.round(confirmedSeats(t.id) / t.max_participants * 100))
  : 0;

function sellState(t){
  /* A departure that has already left is not selling anything, whatever its
     seat fill says. Derived from the date so a trip ages out on its own. */
  if (hasDeparted(t)) return 'Past';
  if (effectiveStatus(t) !== 'published') return effectiveStatus(t)==='scheduled' ? 'Scheduled' : 'Draft';
  return t.max_participants && confirmedSeats(t.id) >= t.max_participants ? 'Full' : 'Selling';
}

function publishTrip(id){
  setTrips(tripRows().map(t => t.id===id ? {...t, status:'published', publish_at:null} : t));
}
function scheduleTrip(id, whenMs){
  setTrips(tripRows().map(t => t.id===id ? {...t, status:'scheduled', publish_at:whenMs} : t));
}
function unpublishTrip(id){
  setTrips(tripRows().map(t => t.id===id ? {...t, status:'draft', publish_at:null} : t));
}

/* Derived from the highest code already in use, not from a counter and not
   from row count. A counter resets on reload while the rows persist, which is
   exactly how a "new" trip ends up reusing a live trip's code. */
function nextTripCode(){
  const max = tripRows().reduce((m,t) => {
    const n = parseInt(String(t.code).replace(/^TRIP\./,''), 10);
    return Number.isFinite(n) ? Math.max(m,n) : m;
  }, 0);
  return 'TRIP.' + String(max + 1).padStart(2,'0');
}

function duplicateTrip(id){
  const rows = tripRows(), src = rows.find(t => t.id===id);
  if (!src) return null;
  const code = nextTripCode();
  const copy = { ...src, id:code, code, name:src.name + ' (copy)',
    status:'draft', publish_at:null,          // a duplicate never inherits a live state
    seats:'0/' + (src.max_participants ?? '—'), fill:0,
    series_id:null,                            // a copy is not part of the original's series
    duplicated_from_trip_id:src.id };          // traceability only — no behaviour reads it
  setTrips(rows.concat([copy]));
  return copy;
}

/* ==========================================================================
   P2 · G-04 — booking detail
   Spec: 2026-08-05-core-platform-traveler-booking-design.md
     `bookings.status` enum: pending_payment | confirmed | completed | cancelled
     `bookings.num_travelers` — a family of four booking together is ONE row
     `bookings.total_amount`  — snapshot of trips.price * num_travelers at
                                booking time (price lock-in)
     `booking_events.event_type` enum, verbatim below
   ========================================================================== */

const BOOKING_STATUS = ['pending_payment','confirmed','completed','cancelled'];
const BOOKING_EVENTS = ['booking_confirmed','payment_captured','installment_due_soon',
  'cancellation_requested','refund_completed','waitlist_seat_freed','waitlist_offer_expiring'];

const bookingStatusOf = b => ({ Verified:'confirmed', Pending:'pending_payment',
  Refunded:'cancelled' })[b.pay] || 'pending_payment';

/* Price lock-in: total_amount was snapshotted at booking time, so a later trip
   price edit must NOT move it. This returns both figures so the screen can show
   the gap rather than assert the rule. */
function priceLock(b){
  const t = tripRows().find(x => x.id === canonicalTripId(b.trip));
  const locked = b.amount;
  const atCurrent = t ? t.price * b.pax : null;
  return { locked, atCurrent, drifted: atCurrent !== null && atCurrent !== locked, current: t ? t.price : null };
}

/* Timeline derived from status — no separate event log to fall out of sync
   with the booking it describes. */
function bookingTimeline(b){
  const st = bookingStatusOf(b), out = [];
  out.push({ type:'booking_confirmed', when:b.date, note:`${b.pax} seat${b.pax>1?'s':''} held on ${b.trip}` });
  if (st === 'confirmed' || st === 'completed')
    out.push({ type:'payment_captured', when:b.date, note:`${INR(b.amount)} captured via ${b.method}` });
  if (st === 'pending_payment')
    out.push({ type:'installment_due_soon', when:'pending', note:'Awaiting capture — the seat is held, not sold' });
  if (st === 'cancelled') {
    out.push({ type:'cancellation_requested', when:b.date, note:'Traveller requested cancellation' });
    out.push({ type:'refund_completed', when:b.date, note:`${INR(b.amount)} refunded` });
  }
  return out;
}

/* ==========================================================================
   P2 · G-24..G-27 — analytics views
   Spec: 2026-08-05-analytics-financial-design.md. Every number below is
   computed from the same rows the operational screens read. Nothing here is
   a hand-authored figure.
   ========================================================================== */

/* A series stamps out several departures that share a title by design, so a
   trip NAME is not a key. Everything below joins on trip id; the name-keyed
   legacy rows (bookings, vendor payments, expenses) resolve to the canonical
   — earliest-created — trip of that name. Without this, three "Kashmir Great
   Lakes" departures each claim the same booking and the destination rollup
   triple-counts it. */
function canonicalTripId(name){
  const t = tripRows().find(x => x.name === name);
  return t ? t.id : null;
}

/* One row per booking ATTEMPT, not per confirmed booking — a conversion rate
   needs a denominator, so cancelled and pending rows stay in the set. */
function analyticsBookings(){
  const st = { Verified:'confirmed', Pending:'pending_payment', Refunded:'cancelled' };
  const current = MOCK.bookings.map(b => ({
    id:b.id, traveler:b.traveller, trip:b.trip, amount:b.amount, pax:b.pax,
    status: st[b.pay] || 'pending_payment', at:new Date(b.date + ' 2026').getTime(),
  }));
  /* Prior-season rows, pinned to LAST season's departures by id. Without
     history there is no such thing as a repeat customer; without the pin,
     a closed season's bookings would fill this season's seats. */
  const past = {}; pastDepartures().forEach(t => { past[t.id] = t.start_date; });
  const prior = [
    { id:'BK-1904', traveler:'Rajesh Kumar', trip:'Markha Valley',      trip_id:'TRIP.P1', amount:96000,  status:'confirmed' },
    { id:'BK-1877', traveler:'Priya Sharma', trip:'Hampta Pass',        trip_id:'TRIP.P2', amount:18500,  status:'confirmed' },

/* Expenses carry no trip column, so they are attributed through the vendor
   they were paid to. Anything that matches no vendor stays UNATTRIBUTED and is
   surfaced as such — silently folding it into one trip would overstate that
   trip's cost and understate every other. */
function expenseTrip(e){
  const vp = vendorPayments().find(v => v.vendor === e.vendor);
  return vp ? vp.trip : null;
}
const unattributedExpenses = () => MOCK.expenses.filter(e => !expenseTrip(e));

/* v_profitability_by_trip — revenue − expenses − vendor_payments.paid_amount.
   Costs land on the canonical trip only: a departure generated today has not
   incurred the original departure's vendor bills. */
function vProfitabilityByTrip(){
  const bk = analyticsBookings(), vps = vendorPayments();
  return tripRows().map(t => {
    const canonical = canonicalTripId(t.name) === t.id;
    const revenue  = bk.filter(b => b.trip_id===t.id && b.status==='confirmed')
                       .reduce((s,b)=>s+b.amount, 0);
    const expenses = !canonical ? 0 : MOCK.expenses.filter(e => expenseTrip(e)===t.name)
                       .reduce((s,e)=>s+e.amt, 0);
    const vendor   = !canonical ? 0 : vps.filter(v => v.trip===t.name)
                       .reduce((s,v)=>s+paidAmount(v), 0);
    const profit   = revenue - expenses - vendor;
    return { trip:t.name, code:t.code, dep:t.dep, past:hasDeparted(t),
             costsOnRecord: expenses + vendor > 0,
             destination:t.destination, revenue, expenses, vendor, profit,
             margin: revenue ? Math.round(profit / revenue * 1000)/10 : null };
  });
}

/* v_profitable_destinations — the same view rolled up by trips.destination */
function vProfitableDestinations(){
  const acc = {};
  vProfitabilityByTrip().forEach(r => {
    const d = acc[r.destination] || (acc[r.destination] = { destination:r.destination, revenue:0, cost:0, profit:0, trips:0 });
    d.revenue += r.revenue; d.cost += r.expenses + r.vendor; d.profit += r.profit; d.trips += 1;
  });
  return Object.values(acc)
    .map(d => ({ ...d, margin: d.revenue ? Math.round(d.profit / d.revenue * 1000)/10 : null }))
    .sort((a,b) => b.profit - a.profit);
}

/* v_occupancy_by_trip — confirmed bookings vs trips.max_participants.
   A null cap is returned as-is; the UI says "capacity data unavailable"
   rather than dividing by null. */
function vOccupancyByTrip(){
  const bk = analyticsBookings();
  return tripRows().map(t => {
    /* The spec's wording is "confirmed booking count vs max_participants", but
       max_participants counts SEATS and one booking can hold several. Counting
       rows against seats would report a full 8-seat trip as 4/8. Seats are
       summed here; the wording looks like a spec slip, flagged not silently
       reinterpreted. */
    const rows   = bk.filter(b => b.trip_id===t.id && b.status==='confirmed');
    const booked = rows.reduce((s,b) => s + (b.pax || 1), 0);
    return { trip:t.name, code:t.code, dep:t.dep, past:hasDeparted(t),
             booked, rows:rows.length, cap:t.max_participants,
             pct: t.max_participants ? Math.round(booked / t.max_participants * 100) : null };
  });
}

/* v_seasonal_bookings — grouped by EXTRACT(MONTH FROM trips.start_date),
   aggregated across years */
function vSeasonalBookings(){
  const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const byTrip = {}; tripRows().forEach(t => { byTrip[t.id] = new Date(t.start_date).getMonth(); });
  const counts = new Array(12).fill(0);
  analyticsBookings().forEach(b => {
    const m = byTrip[b.trip_id];
    if (m !== undefined && b.status === 'confirmed') counts[m] += 1;
  });
  return M.map((label,i) => ({ label, count:counts[i] }));
}

/* v_repeat_customers — per traveller: confirmed count, first/last booking,
   lifetime spend. The >1 bucketing is the API layer's job, done here on read. */
function vRepeatCustomers(){
  const acc = {};
  analyticsBookings().filter(b => b.status==='confirmed').forEach(b => {
    const c = acc[b.traveler] || (acc[b.traveler] = { traveler:b.traveler, bookings:0, first:b.at, last:b.at, spend:0 });
    c.bookings += 1; c.spend += b.amount;
    c.first = Math.min(c.first, b.at); c.last = Math.max(c.last, b.at);
  });
  return Object.values(acc)
    .map(c => ({ ...c, segment: c.bookings > 1 ? 'Repeat' : 'New' }))
    .sort((a,b) => b.spend - a.spend);
}

/* v_customer_geography — grouped by the parsed state on gst_invoices.buyer_address.
   Only invoiced (i.e. paid) bookings appear; unpaid ones contribute no revenue
   to analyse. That scope limit is stated in the UI, not hidden. */
const BUYER_STATE = { 'Rajesh Kumar':'Delhi', 'Priya Sharma':'Maharashtra',
  'Amit Singh':'Uttar Pradesh', 'Neha Verma':'Maharashtra', 'Arjun Mehta':'Karnataka',
  'Sana Khan':'Delhi', 'Dev Patel':'Gujarat' };
  /* Farida Qureshi is deliberately absent — a confirmed booking with no invoice
     yet. She counts as a customer and is excluded from geography, which is the
     scope limit the view declares rather than a row quietly going missing. */
function vCustomerGeography(){
  const acc = {};
  analyticsBookings().filter(b => b.status==='confirmed').forEach(b => {
    const state = BUYER_STATE[b.traveler]; if (!state) return;   // no invoice → not counted
    const g = acc[state] || (acc[state] = { state, bookings:0, revenue:0 });
    g.bookings += 1; g.revenue += b.amount;
  });
  return Object.values(acc).sort((a,b) => b.revenue - a.revenue);
}
/* How much confirmed revenue the geography view cannot place. Stated in the UI
   so the map is never mistaken for the whole book. */
function geographyUnplaced(){
  const rows = analyticsBookings().filter(b => b.status==='confirmed' && !BUYER_STATE[b.traveler]);
  return { count:rows.length, revenue:rows.reduce((s,b)=>s+b.amount,0) };
}

/* v_booking_funnel_conversion — confirmed ÷ all attempts. No dependency on
   trip_daily_views, so it is correct from day one. */
function vBookingFunnelConversion(){
  const bk = analyticsBookings();
  const attempts = bk.length, confirmed = bk.filter(b=>b.status==='confirmed').length;
  return { attempts, confirmed,
           pending: bk.filter(b=>b.status==='pending_payment').length,
           cancelled: bk.filter(b=>b.status==='cancelled').length,
           rate: attempts ? Math.round(confirmed / attempts * 1000)/10 : 0 };

/* The customer LIST is derived from bookings joined to this organizer's trips —
   the profile row only carries enrichment. A traveller who has booked but whose
   profile was never opened still has to appear, or the list silently hides
   customers. */
function crmCustomers(){
  const stats = {};
  analyticsBookings().forEach(b => {
    const c = stats[b.traveler] || (stats[b.traveler] = { name:b.traveler, bookings:0, confirmed:0, spend:0, first:b.at, last:b.at, trips:[] });
    c.bookings += 1;
    if (b.status==='confirmed'){ c.confirmed += 1; c.spend += b.amount; }
    c.first = Math.min(c.first, b.at); c.last = Math.max(c.last, b.at);
    c.trips.push({ id:b.id, trip:b.trip, amount:b.amount, status:b.status, at:b.at, pax:b.pax });
  });
  return Object.values(stats).map(c => {
    const p = customerProfiles().find(x => x.traveler_user_id === c.name) || null;
    return { ...c, profile:p,
      tags: p ? customerTags().filter(t=>t.customer_profile_id===p.id) : [],
      notes: p ? customerNotes().filter(n=>n.customer_profile_id===p.id).sort((a,b)=>b.created_at-a.created_at) : [],
      segment: c.confirmed > 1 ? 'Repeat' : c.confirmed === 1 ? 'New' : 'Prospect',
      hasEmergency: Boolean(p && p.emergency_contact_phone) };
  }).sort((a,b) => b.spend - a.spend);
}

/* ==========================================================================
   PHASE 2 · AI (G-16..G-19)
   Spec: 2026-08-05-ai-assistant-traveler-ai-design.md

   There is no LLM behind this template, and pretending otherwise would be the
   one dishonest thing in it. What IS real here is everything the spec actually
   makes load-bearing, and all of it is verifiable:

     decision 5  synchronous generation, hard timeout
     decision 6  deterministic cache key {feature}:{hash(scoped inputs)},
                 two-tier, shareable vs per-user scoping
     decision 7  outputs are ADVISORY — the AI never writes to `trips`;
                 an explicit accept is what mutates the real record
     decision 8  refund/cancellation/fraud/dispute/payment escalate to a
                 human regardless of what the model decided
     decision 4  the LLM never invents facts — real-world values arrive as
                 structured context and it only phrases them
     quotas      enforced BEFORE the call, so a rejected request never
                 reaches (and never bills) the provider
     audit       one `ai_generation_requests` row per call, cache hits too

   The generator itself is a deterministic stub, marked LLM_STUB, standing
   exactly where the `ai-service` call goes.
   ========================================================================== */

/* The spec's feature enum: fourteen roadmap items plus customer_support_chat. */
const AI_FEATURES = [
  'ai_itinerary','ai_pricing','demand_forecast','ai_marketing_content','ai_trip_description',
  'customer_support_chat','sales_insight','ai_upsell',
  'smart_recommendations','packing_assistant','weather_guidance','fitness_prep',
  'destination_planning','budget_planner',
];
/* Five of the traveller features are traveller-facing surfaces. They share this
   module's tables, so the usage ledger accounts for them, but their screens
   belong to the traveller app, not the organizer console. */
const TRAVELLER_ONLY_FEATURES = ['smart_recommendations','packing_assistant','weather_guidance','fitness_prep','destination_planning','budget_planner'];

const AI_REQUEST_STATUS = ['pending','completed','failed','rate_limited','cache_hit'];

/* Shareable outputs are cached once for everyone who asks the same question.
   Personal ones are scoped per user — mixing the two would either leak one
   traveller's packing list to another, or bill the provider twice for an
   identical public answer. */
const SHAREABLE_FEATURES = ['weather_guidance','destination_planning','ai_trip_description','demand_forecast','sales_insight'];

/* djb2 — a hash, not a cipher. Enough to make the key deterministic. */
function aiHash(str){
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36);
}
function aiCacheKey(feature, inputs, userId){
  const scoped = SHAREABLE_FEATURES.includes(feature)
    ? inputs                                   // same question → same key → one LLM call
    : { ...inputs, _user:userId };              // personal output → never shared
  return feature + ':' + aiHash(JSON.stringify(scoped));
}

/* TTLs by volatility, per decision 6. Null = held until the organizer
   regenerates or the underlying trip fields change. */
const AI_TTL = {
  weather_guidance: 4*3600e3,
  demand_forecast: 24*3600e3, sales_insight: 24*3600e3,
  ai_trip_description: null, ai_itinerary: null,
};
const aiTtlFor = f => (f in AI_TTL) ? AI_TTL[f] : 6*3600e3;

const aiRequests = () => STORE.get('aiGenerationRequests', []);
const aiCache    = () => STORE.get('aiGenerationCache', []);

function aiCacheGet(key){
  const hit = aiCache().find(c => c.cache_key===key);
  if (!hit) return null;
  if (hit.expires_at && hit.expires_at < Date.now()) return null;   // stale = miss
  return hit;
}
function aiCachePut(key, feature, output){
  const rows = aiCache().filter(c => c.cache_key!==key);
  const ttl = aiTtlFor(feature);
  rows.push({ id:'ac'+Date.now()+Math.random().toString(36).slice(2,5), cache_key:key, feature,
              output, created_at:Date.now(), expires_at: ttl ? Date.now()+ttl : null });
  STORE.set('aiGenerationCache', rows);
}
/* A trip edit must invalidate anything generated from that trip, or an accepted
   description keeps describing a trip that no longer exists as described. */
function aiInvalidateTrip(tripId){
  const rows = aiCache().filter(c => !(c.output && c.output._trip === tripId));
  const dropped = aiCache().length - rows.length;
  if (dropped) STORE.set('aiGenerationCache', rows);
  return dropped;
}

/* Quotas are per role and per day, checked before the call. */
const AI_QUOTA = { anonymous:10, traveler:30, organizer:100 };
const aiQuotaFor = () => AI_QUOTA.organizer;          // this console is organizer-side
function aiUsedToday(){
  const dayStart = new Date(); dayStart.setHours(0,0,0,0);
  return aiRequests().filter(r => r.created_at >= dayStart.getTime() && r.status !== 'rate_limited').length;
}
const aiQuotaLeft = () => Math.max(0, aiQuotaFor() - aiUsedToday());

function logAiRequest(row){
  STORE.set('aiGenerationRequests', aiRequests().concat({
    id:'ar'+Date.now()+Math.random().toString(36).slice(2,5),
    user_id:'u-owner', organizer_id:'demo-org', created_at:Date.now(), ...row }));
}

/* LLM_STUB — deterministic text where the ai-service call belongs. It is
   labelled in the UI so nobody mistakes it for model output. */
function llmStub(feature, inputs){
  const t = inputs.trip_id ? tripRows().find(x=>x.id===inputs.trip_id) : null;
  const name = t ? t.name : (inputs.destination || 'this route');
  switch (feature) {
    case 'ai_trip_description':
      return { text:`${name} runs ${t?t.days:'several'} days through high country that rewards people who are honest about their fitness. Small group, one lead guide, all meals on the trail. You will be cold at least one night and you will not regret coming.`, _trip:inputs.trip_id };
    case 'ai_itinerary':
      return { days: Array.from({length: t ? t.days : 5}, (_,i)=>({
        day:i+1, title: i===0?'Arrive and acclimatise' : i===(t?t.days:5)-1?'Descend and transfer out' : `Stage ${i}`,
        detail:'Walking day with a gradual gain; camp set before dusk.' })), _trip:inputs.trip_id };
    case 'ai_marketing_content':
      return { text: inputs.channel==='email'
        ? `Subject: ${name} — a few seats left\n\nWe run this one small on purpose. If you have been putting it off, this is the departure to take.`
        : `${name}. Eight people, one guide, no crowds. Link in bio.`, _trip:inputs.trip_id };
    case 'ai_pricing':
      return { suggested: Math.round((t ? t.price : 50000) * 1.08 / 500) * 500, _trip:inputs.trip_id };
    case 'demand_forecast':
      return { text:'Bookings for the next 90 days are tracking ahead of the same window last year, concentrated in the two shoulder-season departures.', _trip:null };
    case 'sales_insight':
      return { text:'Your highest-margin route is also your least-marketed one. Two of the last five confirmed bookings came from the same referral code.', _trip:null };
    case 'ai_upsell':
      return { addon:'Pre-trek hotel night in the base city', _trip:inputs.trip_id };
    default:
      return { text:'Generated output.', _trip:inputs.trip_id || null };
  }
}

/* THE call path. Quota → cache → (stub) generate → log. Every branch writes an
   ai_generation_requests row, which is what makes token spend reconcilable
   against the provider invoice later. */
function aiGenerate(feature, inputs, opts){
  const key = aiCacheKey(feature, inputs, (opts && opts.userId) || 'u-owner');

  if (aiQuotaLeft() <= 0) {
    logAiRequest({ feature, status:'rate_limited', cache_key:key,
      llm_provider:null, llm_model:null, token_usage:null, latency_ms:0,
      error_message:'Daily quota exhausted', completed_at:Date.now(),
      input_context_summary:{ redacted:true, keys:Object.keys(inputs) } });
    return { ok:false, reason:'rate_limited', retry_after:'tomorrow' };
  }

  const cached = aiCacheGet(key);
  if (cached) {
    /* Logged as a cache_hit with no token usage — no LLM call was made, and the
       row still exists so the hit rate is measurable. */
    logAiRequest({ feature, status:'cache_hit', cache_key:key,
      llm_provider:null, llm_model:null, token_usage:null, latency_ms:3,
      error_message:null, completed_at:Date.now(),
      input_context_summary:{ redacted:true, keys:Object.keys(inputs) } });
    return { ok:true, output:cached.output, cached:true };
  }

  const output = llmStub(feature, inputs);
  aiCachePut(key, feature, output);
  logAiRequest({ feature, status:'completed', cache_key:key,
    llm_provider:'stub', llm_model:'LLM_STUB',
    token_usage:{ prompt_tokens: 180 + Object.keys(inputs).length*20, completion_tokens: 120 },
    latency_ms: 600 + Math.floor(Math.random()*900), error_message:null, completed_at:Date.now(),
    input_context_summary:{ redacted:true, keys:Object.keys(inputs) } });
  return { ok:true, output, cached:false };
}

const DRAFT_STATUS = ['draft','accepted','discarded'];
const itineraryDrafts   = () => STORE.get('aiItineraryDrafts', []);

/* ---- decision 8: the deterministic safety net ----
   These run BEFORE any model verdict is trusted. Today's code does this with
   regex and it is the one genuinely load-bearing behaviour worth preserving. */
const ALWAYS_ESCALATE = ['refund','cancel','cancellation','fraud','dispute','chargeback','payment problem','payment failed','money back'];
function escalationCheck(text){
  const lower = (text || '').toLowerCase();
  const hits = ALWAYS_ESCALATE.filter(k => lower.includes(k));
  return { escalate: hits.length > 0, matched: hits };
}
/* The model's own verdict is advisory. If the deterministic check fires, the
   ticket goes to a human whatever the model said — and the UI shows the
   override happening rather than quietly agreeing. */
function classifyTicket(text, modelSaysHuman){
  const det = escalationCheck(text);
  return { requires_human: det.escalate || Boolean(modelSaysHuman),
           deterministic: det.escalate, matched: det.matched,
           model_said_human: Boolean(modelSaysHuman),
           overrode_model: det.escalate && !modelSaysHuman };
}

/* ==========================================================================
   Branded public pages — `/organizers/:id`, `/trips`, `/trips/:id`
   Specs: core-platform-organizer-auth (public organizer profile),
          core-platform-traveler-booking (browse + detail)

   This is the organizer's own branded page as a traveller sees it, rendered
   from the same rows the console manages. It is a preview inside the console,
   not the traveller app — but the visibility rules are real, and several of
   them were claims elsewhere in this template that nothing had yet enforced:

     · only effectively-published, not-yet-departed trips are listed
     · templates are not trips and can never appear
     · only Verified reviews are shown — the reviews screen has always said
       "unverified reviews are hidden from your public page"; here that
       sentence finally does something
     · banners appear only inside their run window, and only in their placement
     · only verified, in-date certifications are shown as credentials
   ========================================================================== */

/* One place that decides what the public can see. Every public surface reads
   this rather than filtering trips its own way, because three slightly
   different filters is how a draft eventually leaks onto a live page. */
function publicTrips(){
  return tripRows().filter(t =>
    effectiveStatus(t) === 'published' &&      // draft and scheduled stay private
    !hasDeparted(t)                            // a trip that already left is not on sale
  ).sort((a,b) => a.start_date - b.start_date);
}

/* Why a given trip is NOT public. Shown to the organizer so the absence is
   explained rather than looking like a bug. */
function publicExclusionReason(t){
  const eff = effectiveStatus(t);
  if (hasDeparted(t)) return 'already departed';
  if (eff === 'draft') return 'still a draft';
  if (eff === 'scheduled') return 'scheduled to go live ' + (t.publish_at ? DATE_IN(t.publish_at) : 'later');
  return null;
}

const publicReviews = tripName => MOCK.reviews.filter(r => r.v === 'Verified' && (!tripName || r.trip === tripName));
const hiddenReviews = () => MOCK.reviews.filter(r => r.v !== 'Verified');
function avgRating(tripName){
  const rs = publicReviews(tripName);
  if (!rs.length) return null;
  return Math.round(rs.reduce((s,r)=>s+r.rating,0) / rs.length * 10) / 10;
}

/* Certifications are a trust signal, so an expired or unverified one must not

/* A preview counts as a view — which closes the loop with the funnel screen,
   where trip_daily_views had until now only ever been seeded. */
function recordTripView(tripId){
  const t = tripRows().find(x => x.id===tripId); if (!t) return;
  const rows = tripViews();

  if (hit) hit.views += 1; else rows.push({ trip:t.name, views:1, enquiries:0 });
  STORE.set('tripDailyViews', rows);
}

/* ---- AI usage ledger — the FinOps hook ---- */
V['ai-usage'] = () => {
  const rows = aiRequests().slice().reverse();
  const hits = rows.filter(r=>r.status==='cache_hit').length;
  const calls = rows.filter(r=>r.status==='completed').length;
  const limited = rows.filter(r=>r.status==='rate_limited').length;
  const tokens = rows.reduce((s,r)=>s+(r.token_usage?r.token_usage.prompt_tokens+r.token_usage.completion_tokens:0),0);
  const TONE = { completed:'green', cache_hit:'blue', rate_limited:'red', failed:'red', pending:'amber' };
  const byFeature = {};
  rows.forEach(r => { const f = byFeature[r.feature] || (byFeature[r.feature]={feature:r.feature,calls:0,hits:0,tokens:0});
    if (r.status==='completed') f.calls++; if (r.status==='cache_hit') f.hits++;
    if (r.token_usage) f.tokens += r.token_usage.prompt_tokens + r.token_usage.completion_tokens; });
  return `
  <div class="grid gap-4 sm:grid-cols-4 mb-5">
    ${[['Provider calls',String(calls),'billed'],
       ['Cache hits',String(hits), calls+hits ? Math.round(hits/(calls+hits)*100)+'% served free' : 'none yet'],
       ['Refused on quota',String(limited),'never reached the provider'],
       ['Tokens',tokens.toLocaleString('en-IN'),'reconcile against the invoice']]
      .map(([l,v,n])=>card(`<div class="p-4"><p class="text-xs text-nature-500">${l}</p><p class="mt-1 text-2xl font-semibold tnum">${v}</p><p class="text-xs text-nature-400 mt-1">${n}</p></div>`)).join('')}
  </div>
  ${aiQuotaStrip()}
  <div class="mt-4">${card(`<div class="p-4">${sectionHead('Per feature', `<span class="text-xs text-nature-500 font-mono">ai_generation_requests</span>`)}
    <p class="text-sm text-nature-600">One row per call regardless of feature, cache hits included — a hit carries no token usage, which is exactly how the saving becomes measurable rather than assumed.</p></div>
  ${Object.keys(byFeature).length?table([{t:'Feature'},{t:'Calls',right:true},{t:'Cache hits',right:true},{t:'Tokens',right:true}],
    Object.values(byFeature).sort((a,b)=>b.tokens-a.tokens).map(f=>
      td(`<span class="font-mono text-xs">${f.feature}</span>${TRAVELLER_ONLY_FEATURES.includes(f.feature)?'<div class="text-[11px] text-nature-400">traveller-facing surface</div>':''}`)+
      td(`<span class="tnum">${f.calls}</span>`,'text-right')+
      td(`<span class="tnum">${f.hits}</span>`,'text-right')+
      td(`<span class="tnum">${f.tokens.toLocaleString('en-IN')}</span>`,'text-right')))
    :`<div class="p-4">${emptyState('Nothing logged yet','Generate something from AI studio, marketing or insights.')}</div>`}`)}</div>

  <div class="mt-4">${card(`<div class="p-4">${sectionHead('Cache', `<span class="text-xs text-nature-500 font-mono">ai_generation_cache</span>`)}
    <p class="text-sm text-nature-600">Keys are <code class="font-mono">{feature}:{hash(scoped inputs)}</code>. Shareable outputs — weather, destination plans, trip descriptions, forecasts — use an unscoped key so everyone asking the same question hits one entry. Personal ones carry the user in the key.</p>
    ${aiCache().length?`<ul class="mt-3 space-y-1.5">${aiCache().map(c=>`<li class="text-sm flex flex-wrap items-center justify-between gap-2">
      <span class="font-mono text-xs">${c.cache_key}</span>
      <span class="text-xs text-nature-500">${SHAREABLE_FEATURES.includes(c.feature)?'shareable':'per-user'} · ${c.expires_at?'expires '+new Date(c.expires_at).toLocaleString('en-IN'):'held until regenerated'}</span></li>`).join('')}</ul>`
    :'<p class="text-sm text-nature-400 mt-2">Empty.</p>'}
    <div class="mt-3 flex flex-wrap gap-2">
      ${btn('Exhaust quota (test the refusal)','ghost','onclick="exhaustQuota()"')}
      ${btn('Clear cache','ghost','onclick="clearAiCache()"')}
    </div>
  </div>`)}</div>

  <div class="mt-4">${card(`<div class="p-4">${sectionHead('Request log')}</div>
  ${rows.length?table([{t:'Feature'},{t:'Status'},{t:'Cache key'},{t:'Latency',right:true},{t:'Tokens',right:true},{t:'When'}], rows.slice(0,40).map(r=>
    td(`<span class="font-mono text-xs">${r.feature}</span>`)+
    td(badge(r.status.replace('_',' '), TONE[r.status]))+
    td(`<span class="font-mono text-[11px] text-nature-500">${r.cache_key}</span>`)+
    td(`<span class="tnum">${r.latency_ms}ms</span>`,'text-right')+
    td(r.token_usage?`<span class="tnum">${r.token_usage.prompt_tokens+r.token_usage.completion_tokens}</span>`:'<span class="text-nature-400">—</span>','text-right')+
    td(`<span class="text-xs text-nature-500">${new Date(r.created_at).toLocaleTimeString('en-IN')}</span>`)
  )):''}`)}</div>`;
};

  const live = ['checklist','rooms','transport','equipment','attendance','permits','emergency'];

  const header = card(`<div class="p-4">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <div class="flex items-center gap-2">
          <h2 class="font-semibold">${t.name}</h2>${badge(sellState(t))}
        </div>
        <p class="text-sm text-nature-500">${t.code} · departs ${t.dep} · ${roster.length} booking${roster.length===1?'':'s'} · ${confirmedSeats(t.id)} seat${confirmedSeats(t.id)===1?'':'s'} confirmed</p>
      </div>
      <label class="text-sm">Departure
        <select class="ml-2 h-9 rounded-md border border-nature-300 px-2 bg-white" onchange="setOpsTrip(this.value)">
          ${allowed.filter(x=>!hasDeparted(x) || x.id===t.id).map(x=>`<option value="${x.id}" ${x.id===t.id?'selected':''}>${x.name} — ${x.dep}</option>`).join('')}
        </select></label>
    </div>
    <div class="mt-4 grid gap-3 sm:grid-cols-3">
      ${[['Checklist complete', rdy.pct + '%', rdy.blocked.length + ' traveller' + (rdy.blocked.length===1?'':'s') + ' still blocked'],
         ['Permits clear', blockers.length ? 'No' : 'Yes', blockers.length ? blockers.length + ' outstanding' : 'all approved and in date'],
         ['Rooms allocated', roomAssignments().filter(r=>tripRooms().some(rm=>rm.id===r.trip_room_id && rm.trip_id===t.id)).length + '/' + roster.length, 'bookings placed']]
        .map(([l,v,n])=>`<div class="rounded-md border border-nature-200 p-3"><p class="text-xs text-nature-500">${l}</p><p class="mt-0.5 text-xl font-semibold tnum">${v}</p><p class="text-xs text-nature-400">${n}</p></div>`).join('')}
    </div>
    <div class="mt-4 flex flex-wrap gap-1.5">
      ${live.map(k=>`<button class="px-3 h-8 rounded-md text-sm ${k===tab?'bg-nature-900 text-white':'bg-nature-100 hover:bg-nature-200'}" onclick="setOpsTab(&#39;${k}&#39;)">${OPS_TAB_LABEL[k]}</button>`).join('')}
    </div>
  </div>`);

  return header + `<div class="mt-4">${(OPS_VIEW[tab] || OPS_VIEW.checklist)(t, roster)}</div>`;
};

const OPS_VIEW = {};

OPS_VIEW.checklist = (t, roster) => {
  const tpls = checklistTemplates().filter(c => c.trip_id===t.id).sort((a,b)=>a.sort_order-b.sort_order);
  if (!tpls.length) return card(`<div class="p-4">${emptyState('No checklist for this departure','Add the items every traveller must clear before they fly.')}</div>`);
  return card(`<div class="p-4">${sectionHead('Pre-departure checklist', `<span class="text-xs text-nature-500 font-mono">booking_checklist_completions</span>`)}
    <p class="text-sm text-nature-600">One row per booking, not per person — the spec models completions against <code class="font-mono">bookings.id</code>. Required items are marked <span class="text-red-600">*</span>; optional ones never block a departure.</p></div>
  ${table([{t:'Booking'}].concat(tpls.map(c=>({t:c.label + (c.is_required?' <span class="text-red-600">*</span>':'')}))).concat([{t:'Ready',right:true}]),
    roster.map(b=>{
      const req = tpls.filter(c=>c.is_required);
      const ok  = req.every(c=>checklistDone(b.id, c.id));
      return td(`<span class="font-medium">${b.traveler}</span><div class="text-xs text-nature-500">${b.id} · ${b.pax} seat${b.pax===1?'':'s'}</div>`)+
        tpls.map(c=>{
          const done = checklistDone(b.id, c.id);
          return td(`<button onclick="toggleChecklist(&#39;${b.id}&#39;,&#39;${c.id}&#39;)" title="${done?'Mark incomplete':'Mark complete'}"
            class="w-6 h-6 rounded ${done?'bg-forest-600 text-white':'bg-nature-100 hover:bg-nature-200 text-transparent'} grid place-items-center text-xs font-bold">✓</button>`);
        }).join('')+
        td(ok?badge('Ready','green'):badge('Blocked','red'),'text-right');
    }))}`);
};

OPS_VIEW.rooms = (t, roster) => {
  const rooms = tripRooms().filter(r => r.trip_id===t.id);
  const placed = new Set(roomAssignments().filter(r=>rooms.some(rm=>rm.id===r.trip_room_id)).map(r=>r.booking_id));
  const unplaced = roster.filter(b => !placed.has(b.id));
  return `
  ${card(`<div class="p-4">${sectionHead('Room allocation', `<span class="text-xs text-nature-500 font-mono">trip_rooms · booking_room_assignments</span>`)}
    <p class="text-sm text-nature-600">Over-capacity is checked at assignment time, not enforced by the database — an organizer adding an extra mattress deliberately is warned, not blocked.</p>
    <div class="mt-4 grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
      ${rooms.map(rm=>{
        const occ = roomOccupants(rm.id), over = occ > rm.capacity;
        const inRoom = roomAssignments().filter(r=>r.trip_room_id===rm.id);
        return `<div class="rounded-md border ${over?'border-red-300 bg-red-50':'border-nature-200'} p-3">
          <div class="flex items-center justify-between"><p class="font-medium">Room ${rm.room_label}</p>
            <span class="text-xs tnum ${over?'text-red-700 font-medium':'text-nature-500'}">${occ}/${rm.capacity}</span></div>
          <p class="text-xs text-nature-500">${rm.room_type}${rm.trip_vendor_assignment_id?' · '+rm.trip_vendor_assignment_id:''}</p>
          ${over?`<p class="text-xs text-red-700 mt-1">Over capacity by ${occ-rm.capacity}</p>`:''}
          <ul class="mt-2 space-y-1 text-sm">${inRoom.length?inRoom.map(r=>{
            const b = analyticsBookings().find(x=>x.id===r.booking_id);
            return `<li class="flex items-center justify-between gap-2"><span>${b?b.traveler:r.booking_id} <span class="text-nature-400">(${b?b.pax:'?'})</span></span>
              <button class="text-xs text-nature-500 hover:text-red-600" onclick="unassignRoom(&#39;${r.id}&#39;)">remove</button></li>`;
          }).join(''):'<li class="text-sm text-nature-400">Empty</li>'}</ul>
          ${rm.notes?`<p class="text-xs text-nature-400 mt-2">${rm.notes}</p>`:''}
        </div>`;
      }).join('')}
    </div>
    ${unplaced.length?`<div class="mt-4 rounded-md border border-earth-300 bg-earth-50 p-3">
      <p class="text-sm font-medium">${unplaced.length} booking${unplaced.length===1?'':'s'} not yet placed</p>
      <div class="mt-2 flex flex-wrap gap-2">${unplaced.map(b=>`<button class="px-2.5 h-8 rounded-md bg-white border border-nature-300 hover:bg-nature-100 text-xs" onclick="assignRoom(&#39;${b.id}&#39;)">${b.traveler} (${b.pax}) →</button>`).join('')}</div>
    </div>`:`<p class="text-sm text-forest-700 mt-4">Every booking on this departure has a room.</p>`}
  </div>`)}
  ${card(`<div class="p-4 text-sm">
    <p class="font-medium">A modelling limit worth knowing before you rely on this</p>
    <p class="text-nature-700 mt-1">The spec keys room assignments to <code class="font-mono">bookings.id</code>, and a booking can hold several travellers. A family of four booked together therefore cannot be split across two rooms — the assignment moves all four or none. Splitting a party needs a per-participant table the spec does not define.</p>
  </div>`)}`;
};

OPS_VIEW.transport = (t, roster) => {
  const legs = transportLegs().filter(l => l.trip_id===t.id);
  const assigned = transportAssignments();
  return card(`<div class="p-4">${sectionHead('Transport legs', `<span class="text-xs text-nature-500 font-mono">trip_transport_legs</span>`)}
    <p class="text-sm text-nature-600">A traveller may ride several legs on a multi-leg trip, but only once per leg — <code class="font-mono">UNIQUE(booking_id, trip_transport_leg_id)</code>.</p>
    <div class="mt-4 space-y-3">
      ${legs.length ? legs.map(l=>{
        const on = assigned.filter(a=>a.trip_transport_leg_id===l.id);
        const seats = on.reduce((s,a)=>{const b=analyticsBookings().find(x=>x.id===a.booking_id); return s+(b?b.pax:1);},0);
        const over = seats > l.capacity;
        return `<div class="rounded-md border ${over?'border-red-300 bg-red-50':'border-nature-200'} p-3">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div><p class="font-medium">${l.vehicle_label}</p>
              <p class="text-xs text-nature-500">${l.departure_point}${l.departure_time?' · '+DATE_IN(l.departure_time):''}${l.trip_vendor_assignment_id?' · '+l.trip_vendor_assignment_id:''}</p></div>
            <span class="text-xs tnum ${over?'text-red-700 font-medium':'text-nature-500'}">${seats}/${l.capacity} seats</span>
          </div>
          <div class="mt-2 flex flex-wrap gap-1.5">${on.map(a=>{
            const b=analyticsBookings().find(x=>x.id===a.booking_id);
            return `<span class="text-xs bg-nature-100 rounded px-2 py-1">${b?b.traveler:a.booking_id}${a.seat_number?' · '+a.seat_number:''}</span>`;
          }).join('') || '<span class="text-xs text-nature-400">Nobody assigned</span>'}</div>
          ${l.notes?`<p class="text-xs text-nature-400 mt-2">${l.notes}</p>`:''}
        </div>`;
      }).join('') : emptyState('No transport legs','Add the vehicles running this departure.')}
    </div>
    ${(() => {
      const placed = new Set(assigned.filter(a=>legs.some(l=>l.id===a.trip_transport_leg_id)).map(a=>a.booking_id));
      const missing = roster.filter(b=>!placed.has(b.id));
      return missing.length ? `<div class="mt-4 rounded-md border border-earth-300 bg-earth-50 p-3 text-sm">
        <span class="font-medium">${missing.length} booking${missing.length===1?'':'s'} with no seat on any leg:</span>
        ${missing.map(b=>b.traveler).join(', ')}</div>` : '';
    })()}
  </div>`);
};

OPS_VIEW.equipment = (t) => {
  const rows = allocations().filter(a => a.trip_id===t.id);
  const invalid = rows.filter(a => !allocationValid(a));
  return `
  ${card(`<div class="p-4">${sectionHead('Allocated to this departure', `<span class="text-xs text-nature-500 font-mono">trip_equipment_allocations</span>`)}</div>
  ${rows.length ? table([{t:'Item'},{t:'Source'},{t:'Qty',right:true},{t:'Returned',right:true},{t:'Status'},{t:'',right:true}], rows.map(a=>
    td(`<span class="font-medium">${a.item_description}</span>${a.equipment_item_id?`<div class="text-xs text-nature-500">${a.equipment_item_id}</div>`:''}`)+
    td(a.source==='owned'?badge('Owned','slate'):badge('Vendor rental','blue')+`<div class="text-xs text-nature-500 mt-0.5">${a.trip_vendor_assignment_id}</div>`)+
    td(`<span class="tnum">${a.quantity}</span>`,'text-right')+
    td(a.quantity_returned==null?'<span class="text-nature-400">—</span>':`<span class="tnum">${a.quantity_returned}</span>`,'text-right')+
    td(`<span class="font-mono text-xs">${a.status}</span>`)+
    td(a.status==='issued'
        ? btn('Mark returned','ghost',`onclick="returnAllocation(&#39;${a.id}&#39;)"`)
        : a.status==='reserved'
        ? btn('Issue','ghost',`onclick="issueAllocation(&#39;${a.id}&#39;)"`)
        : '<span class="text-xs text-nature-400">closed</span>','text-right')
  )) : `<div class="p-4">${emptyState('Nothing allocated','Reserve owned kit or a vendor rental for this departure.')}</div>`}`)}
  ${invalid.length?`<div class="mt-4">${card(`<div class="p-4 text-sm"><p class="font-medium text-red-700">${invalid.length} allocation row${invalid.length===1?'':'s'} fail the spec CHECK</p>
    <p class="text-nature-700 mt-1">Each row must have exactly one of <code class="font-mono">equipment_item_id</code> / <code class="font-mono">trip_vendor_assignment_id</code>, matching its <code class="font-mono">source</code>. A row satisfying neither is stock nobody owns.</p></div>`)}</div>`:''}
  <div class="mt-4">${card(`<div class="p-4">${sectionHead('Owned catalog', `<span class="text-xs text-nature-500 font-mono">equipment_items</span>`)}
    <p class="text-sm text-nature-600">Free stock is the catalog total minus everything reserved or issued across all live departures — promising the same four tents twice is the failure this prevents.</p></div>
  ${table([{t:'Item'},{t:'Category'},{t:'Total',right:true},{t:'Committed',right:true},{t:'Free',right:true},{t:'Condition'}], equipmentItems().map(e=>{
    const av = equipmentAvailability(e.id);
    return td(`<span class="font-medium">${e.name}</span>`)+td(e.category)+
      td(`<span class="tnum">${av.total}</span>`,'text-right')+
      td(`<span class="tnum">${av.committed}</span>`,'text-right')+
      td(`<span class="tnum font-medium ${av.free<=0?'text-red-600':''}">${av.free}</span>`,'text-right')+
      td(`<span class="text-nature-500">${e.condition_notes||'—'}</span>`);
  }))}`)}</div>`;
};

OPS_VIEW.attendance = (t, roster) => {
  const today = new Date().toISOString().slice(0,10);
  return card(`<div class="p-4">${sectionHead('Attendance — ' + today, `<span class="text-xs text-nature-500 font-mono">booking_attendance</span>`)}
    <p class="text-sm text-nature-600">One row per booking per date — <code class="font-mono">UNIQUE(booking_id, attendance_date)</code>, so marking twice updates rather than duplicates.</p></div>
  ${table([{t:'Booking'},{t:'Seats'},{t:'Status'},{t:'',right:true}], roster.map(b=>{
    const st = attendanceFor(b.id, today);
    return td(`<span class="font-medium">${b.traveler}</span><div class="text-xs text-nature-500">${b.id}</div>`)+
      td(`<span class="tnum">${b.pax}</span>`)+
      td(st?`<span class="font-mono text-xs">${st}</span>`:'<span class="text-nature-400 text-sm">not marked</span>')+
      td(`<div class="flex gap-1 justify-end flex-wrap">${ATTENDANCE.map(a=>
        `<button class="px-2 h-7 rounded text-[11px] ${st===a?'bg-nature-900 text-white':'bg-nature-100 hover:bg-nature-200'}" onclick="markAttendance(&#39;${b.id}&#39;,&#39;${a}&#39;)">${a.replace('_',' ')}</button>`).join('')}</div>`,'text-right');
  }))}`);
};

OPS_VIEW.permits = (t) => {
  const rows = tripPermits().filter(p => p.trip_id===t.id);
  const TONE_FOR = { approved:'green', applied:'amber', not_applied:'slate', rejected:'red', expired:'red' };
  return card(`<div class="p-4">${sectionHead('Permits', `<span class="text-xs text-nature-500 font-mono">trip_permits</span>`)}
    <p class="text-sm text-nature-600">Status is derived on read: an approved permit whose expiry has passed reads <code class="font-mono">expired</code>, whatever the stored value says. Changing status emits <code class="font-mono">permit_status_changed</code> to the ops outbox.</p></div>
  ${rows.length ? table([{t:'Permit'},{t:'Authority'},{t:'Number'},{t:'Expires'},{t:'Status'},{t:'',right:true}], rows.map(p=>{
    const st = permitStatus(p), drifted = st !== p.status;
    return td(`<span class="font-medium">${(p.custom_type_label||p.permit_type).replace(/_/g,' ')}</span>${p.notes?`<div class="text-xs text-nature-500">${p.notes}</div>`:''}`)+
      td(p.issuing_authority)+
      td(p.permit_number?`<span class="font-mono text-xs">${p.permit_number}</span>`:'<span class="text-nature-400">—</span>')+
      td(p.expiry_date?DATE_IN(p.expiry_date):'<span class="text-nature-400">—</span>')+
      td(badge(st.replace(/_/g,' '), TONE_FOR[st]) + (drifted?`<div class="text-[11px] text-red-700 mt-0.5">stored as ${p.status}</div>`:''))+
      td(`<select class="h-8 rounded-md border border-nature-300 px-2 bg-white text-xs" onchange="setPermitStatus(&#39;${p.id}&#39;,this.value)">
        ${PERMIT_STATUS.map(s=>`<option value="${s}" ${s===p.status?'selected':''}>${s.replace(/_/g,' ')}</option>`).join('')}</select>`,'text-right');
  })) : `<div class="p-4">${emptyState('No permits recorded','Add the permits this route needs.')}</div>`}`);
};

OPS_VIEW.emergency = (t) => {
  const plan = emergencyPlanFor(t.id);
  const inc = incidents().filter(i => i.trip_id===t.id).sort((a,b)=>b.occurred_at-a.occurred_at);
  const SEV_TONE = { low:'slate', medium:'amber', high:'red', critical:'red' };
  return `
  ${card(`<div class="p-4">${sectionHead('Emergency plan', `<span class="text-xs text-nature-500 font-mono">trip_emergency_plans</span>`)}
    ${plan ? `<dl class="grid sm:grid-cols-2 gap-x-6 gap-y-3 text-sm">
      <div><dt class="text-nature-500">Nearest hospital</dt><dd class="font-medium">${plan.nearest_hospital_name}</dd>
        <dd class="text-nature-600">${plan.nearest_hospital_phone}</dd>
        <dd class="text-nature-500 text-xs">${plan.nearest_hospital_address}</dd></div>
      <div><dt class="text-nature-500">Local authority</dt><dd>${plan.local_authority_contact || '—'}</dd></div>
      <div class="sm:col-span-2"><dt class="text-nature-500">Evacuation</dt><dd>${plan.evacuation_notes}</dd></div>
    </dl>
    <p class="text-xs text-nature-400 mt-3">Last updated ${DATE_IN(plan.updated_at)}</p>`
    : emptyState('No emergency plan filed','This must be completed before departure.')}
  </div>`)}
  <div class="mt-4">${card(`<div class="p-4">${sectionHead('Incident log', `<span class="text-xs text-nature-500 font-mono">trip_emergency_incidents</span>`)}
    <p class="text-sm text-nature-600">Append-only in practice — an incident is closed by resolving it, never by deleting the record.</p></div>
  ${inc.length ? `<div class="divide-y divide-nature-100">${inc.map(i=>`<div class="p-4">
    <div class="flex flex-wrap items-center gap-2">
      ${badge(i.severity, SEV_TONE[i.severity])}
      <span class="font-mono text-xs text-nature-500">${i.incident_type}</span>
      ${badge(i.status==='resolved'?'Resolved':i.status==='in_progress'?'Open':'Open', i.status==='resolved'?'green':'amber')}
      <span class="text-xs text-nature-400 ml-auto">${DATE_IN(i.occurred_at)}</span>
    </div>
    <p class="text-sm mt-2">${i.description}</p>
    <p class="text-sm text-nature-600 mt-1"><span class="text-nature-500">Actions:</span> ${i.actions_taken}</p>
    <p class="text-xs text-nature-400 mt-1">Reported by ${i.reported_by_user_id}${i.booking_id?' · concerns '+i.booking_id:''}</p>
    ${i.status!=='resolved'?`<div class="mt-2">${btn('Mark resolved','ghost',`onclick="resolveIncident(&#39;${i.id}&#39;)"`)}</div>`:''}
  </div>`).join('')}</div>` : `<div class="p-4">${emptyState('No incidents logged','Nothing has gone wrong on this departure.')}</div>`}`)}</div>
  <div class="mt-4">${card(`<div class="p-4">${sectionHead('Medical declarations + emergency contacts', `<span class="text-xs text-nature-500 font-mono">booking_medical_declarations</span>`)}
    <p class="text-sm text-nature-600">This is the table the booking screen could not read from before it existed. Trip leaders see this for their own assigned departures (permission matrix row 173).</p></div>
  ${table([{t:'Booking'},{t:'Fitness'},{t:'Conditions'},{t:'Emergency contact'}], opsRoster(t.id).map(b=>{
    const m = medicalFor(b.id);
    if (!m) return td(`<span class="font-medium">${b.traveler}</span>`)+td('<span class="text-red-600 text-sm">not filed</span>')+td('<span class="text-nature-400">—</span>')+td('<span class="text-red-600 text-sm">missing</span>');
    const tone = { fit:'green', minor_concerns:'amber', needs_review:'red' }[m.fitness_self_assessment];
    return td(`<span class="font-medium">${b.traveler}</span><div class="text-xs text-nature-500">${b.id}</div>`)+
      td(badge(m.fitness_self_assessment.replace(/_/g,' '), tone))+
      td(m.has_medical_conditions
          ? `<span class="text-sm">${m.conditions_description}</span>${m.medications?`<div class="text-xs text-nature-500">Meds: ${m.medications}</div>`:''}${m.allergies?`<div class="text-xs text-nature-500">Allergies: ${m.allergies}</div>`:''}`
          : `<span class="text-sm text-nature-500">None declared</span>${m.allergies?`<div class="text-xs text-nature-500">Allergies: ${m.allergies}</div>`:''}`)+
      td(`<span class="font-medium">${m.emergency_contact_name}</span><div class="text-xs text-nature-500">${m.emergency_contact_phone} · ${m.emergency_contact_relation}</div>`);
  }))}`)}</div>`;
};

/* ---- P3 · documents ---- */
V.documents = () => {
  const all = documents().filter(d => d.category !== 'organizer_certification');
  const bad = documents().filter(d => !documentSubjectValid(d));
  const expiring = documents().filter(d => ['expired','expiring'].includes(docExpiry(d).state));
  const CAT_TONE = { permit:'blue', insurance:'green', waiver:'slate', medical_form:'amber', vendor_contract:'slate', invoice:'slate', other:'slate' };
  return `
  ${expiring.length ? card(`<div class="p-4">
    <p class="font-medium">${expiring.length} document${expiring.length===1?'':'s'} need attention</p>
    <p class="text-sm text-nature-600 mt-1">Anything expired, or expiring within ${DOC_EXPIRY_WARN_DAYS} days, is what the <code class="font-mono">document_expiring_soon</code> scan picks up.</p>
    <ul class="mt-2 space-y-1 text-sm">${expiring.map(d=>{const e=docExpiry(d);
      return `<li class="flex flex-wrap items-center gap-2"><span class="font-medium">${d.file_name}</span>
        <span class="text-nature-500">${documentSubject(d)}</span>
        ${e.state==='expired'?badge('expired '+Math.abs(e.days)+'d ago','red'):badge('expires in '+e.days+'d','amber')}
        ${btn('Notify','ghost',`onclick="notifyExpiry(&#39;${d.id}&#39;)"`)}</li>`;
    }).join('')}</ul>
  </div>`, 'border-earth-300') : ''}
  <div class="mt-4">${card(`<div class="p-4">${sectionHead('Documents', `<span class="text-xs text-nature-500 font-mono">documents</span>`)}
    <p class="text-sm text-nature-600">One polymorphic table with four nullable subject columns and a CHECK that exactly one is set — so a single upload endpoint and a single expiry scan cover permits, insurance, waivers, medical forms and vendor contracts alike.</p></div>
  ${table([{t:'File'},{t:'Category'},{t:'Attached to'},{t:'Issued'},{t:'Expires'},{t:'Verification'}], all.map(d=>{
    const e = docExpiry(d);
    return td(`<span class="font-medium">${d.file_name}</span><div class="text-xs text-nature-500">${Math.round(d.file_size_bytes/1024)} KB · uploaded by ${d.uploaded_by}</div>`)+
      td(badge(d.category.replace(/_/g,' '), CAT_TONE[d.category]))+
      td(documentSubject(d))+
      td(d.issue_date?DATE_IN(d.issue_date):'<span class="text-nature-400">—</span>')+
      td(!d.expiry_date?'<span class="text-nature-400">—</span>'
         : e.state==='expired' ? `<span class="text-red-600">${DATE_IN(d.expiry_date)}</span>`
         : e.state==='expiring'? `<span class="text-earth-800">${DATE_IN(d.expiry_date)}</span>`
         : DATE_IN(d.expiry_date))+
      td(d.verification_status==='not_applicable'?'<span class="text-nature-400 text-sm">n/a</span>'
         : badge(d.verification_status, d.verification_status==='verified'?'green':d.verification_status==='rejected'?'red':'amber'));
  }))}`)}</div>

/* ---- G-24 · profitability ---- */
V['an-profitability'] = () => {
  const rows = vProfitabilityByTrip().sort((a,b)=>b.profit-a.profit);
  const un = unattributedExpenses();
  const T = rows.reduce((a,r)=>({rev:a.rev+r.revenue, cost:a.cost+r.expenses+r.vendor, pro:a.pro+r.profit}),{rev:0,cost:0,pro:0});
  return `
  <div class="grid gap-4 sm:grid-cols-3 mb-5">
    ${[['Revenue',INR(T.rev),'confirmed bookings only'],['Cost',INR(T.cost),'expenses + vendor paid'],['Profit',INR(T.pro),T.rev?Math.round(T.pro/T.rev*1000)/10+'% margin':'—']]
      .map(([l,v,n])=>card(`<div class="p-4"><p class="text-xs text-nature-500">${l}</p><p class="mt-1 text-2xl font-semibold tnum">${v}</p><p class="text-xs text-nature-400 mt-1">${n}</p></div>`)).join('')}
  </div>
  ${card(`<div class="p-4">${sectionHead('Profitability by trip', `<span class="text-xs text-nature-500 font-mono">v_profitability_by_trip</span>`)}
    <p class="text-sm text-nature-600">Revenue − expenses − vendor payments <em>actually paid</em>. An agreed vendor amount that has not been released is not a cost yet.</p></div>
  ${table([{t:'Trip'},{t:'Destination'},{t:'Revenue',right:true},{t:'Expenses',right:true},{t:'Vendor paid',right:true},{t:'Profit',right:true},{t:'Margin',right:true}], rows.map(r=>
    td(`<span class="font-medium">${r.trip}</span><div class="text-xs text-nature-500">${r.code} · ${r.dep}${r.past?' · departed':''}</div>`)+td(r.destination)+
    td(`<span class="tnum">${INR(r.revenue)}</span>`,'text-right')+
    td(`<span class="tnum">${INR(r.expenses)}</span>`,'text-right')+
    td(`<span class="tnum">${INR(r.vendor)}</span>`,'text-right')+
    td(`<span class="tnum font-medium ${r.profit<0?'text-red-600':''}">${INR(r.profit)}</span>`,'text-right')+
    td(r.margin===null?'<span class="text-nature-400">—</span>'
       : `<span class="tnum ${r.margin<0?'text-red-600':''}">${r.margin}%</span>${r.revenue && !r.costsOnRecord?'<div class="text-[11px] text-earth-700">no costs recorded</div>':''}`,'text-right')
  ))}
  ${(()=>{const n=rows.filter(r=>r.revenue && !r.costsOnRecord).length; return n ? `<div class="px-4 py-3 border-t border-nature-200 text-sm text-nature-600">
    <strong class="tnum">${n}</strong> departure${n>1?'s':''} show a 100% margin only because no expense or vendor payment rows exist against ${n>1?'them':'it'} — that is missing cost data, not profit. Older departures in this dataset predate the vendor payment records.
  </div>` : '';})()}`)}
  <div class="mt-4">${card(`<div class="p-4">${sectionHead('Most profitable destinations', `<span class="text-xs text-nature-500 font-mono">v_profitable_destinations</span>`)}</div>
  ${table([{t:'Destination'},{t:'Trips'},{t:'Revenue',right:true},{t:'Cost',right:true},{t:'Profit',right:true},{t:'Margin',right:true}], vProfitableDestinations().map(d=>
    td(`<span class="font-medium">${d.destination}</span>`)+td(`<span class="tnum">${d.trips}</span>`)+
    td(`<span class="tnum">${INR(d.revenue)}</span>`,'text-right')+
    td(`<span class="tnum">${INR(d.cost)}</span>`,'text-right')+
    td(`<span class="tnum font-medium ${d.profit<0?'text-red-600':''}">${INR(d.profit)}</span>`,'text-right')+
    td(d.margin===null?'<span class="text-nature-400">—</span>':`<span class="tnum">${d.margin}%</span>`,'text-right')
  ))}`)}</div>
  ${un.length ? `<div class="mt-4">${card(`<div class="p-4">
    <p class="font-medium text-sm">${un.length} expense${un.length>1?'s':''} could not be attributed to a trip</p>
    <p class="text-sm text-nature-600 mt-1">These are paid to a party with no vendor payment record, so no trip can claim them. They are excluded from the per-trip figures above rather than being folded into one trip — that would overstate its cost and understate every other.</p>
    <ul class="mt-2 text-sm text-nature-700 list-disc pl-5">${un.map(e=>`<li>${e.cat} — ${e.vendor} — <span class="tnum">${INR(e.amt)}</span></li>`).join('')}</ul>
  </div>`)}</div>` : ''}`;
};

       ['Capacity unknown',String(occ.length-measurable.length),'no max_participants']]
      .map(([l,v,n])=>card(`<div class="p-4"><p class="text-xs text-nature-500">${l}</p><p class="mt-1 text-2xl font-semibold tnum">${v}</p><p class="text-xs text-nature-400 mt-1">${n}</p></div>`)).join('')}
  </div>
  ${card(`<div class="p-4">${sectionHead('Occupancy by trip', `<span class="text-xs text-nature-500 font-mono">v_occupancy_by_trip</span>`)}
    <p class="text-sm text-nature-600">A trip with no capacity set returns its cap as <code class="font-mono">NULL</code>. That is shown as unavailable, never as 0% or 100%.</p></div>
  ${table([{t:'Trip'},{t:'Seats confirmed'},{t:'Capacity'},{t:'Occupancy'}], occ.map(o=>
    td(`<span class="font-medium">${o.trip}</span><div class="text-xs text-nature-500">${o.code} · ${o.dep}${o.past?' · departed':''}</div>`)+
    td(`<span class="tnum">${o.booked}</span><div class="text-[11px] text-nature-400">across ${o.rows} booking${o.rows===1?'':'s'}</div>`)+

  ))}`)}
  <div class="mt-4">${card(`<div class="p-4">${sectionHead('Seasonal demand', `<span class="text-xs text-nature-500 font-mono">v_seasonal_bookings</span>`)}
    <p class="text-sm text-nature-600 mb-3">Confirmed bookings grouped by departure month, aggregated across years — which months consistently sell.</p>
    ${bars(season.map(s=>s.count||0.001), 140)}
    <div class="flex justify-between text-[11px] text-nature-400 mt-1">${season.map(s=>`<span>${s.label[0]}</span>`).join('')}</div>
    <div class="mt-3 flex flex-wrap gap-2">${season.filter(s=>s.count).map(s=>`<span class="text-xs bg-nature-100 rounded px-2 py-1">${s.label}: <span class="tnum font-medium">${s.count}</span></span>`).join('')}</div>
  </div>`)}</div>`;

/* ---- G-27 · marketing analytics ---- */

  return `
