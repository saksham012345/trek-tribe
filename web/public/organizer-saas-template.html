    ${[['Attempt → confirmed',f.rate+'%','v_booking_funnel_conversion'],
       ['View → enquiry',(totalViews?Math.round(totalEnq/totalViews*1000)/10:0)+'%','trip_daily_views'],
       ['Pending payment',String(f.pending),'attempts not yet confirmed'],
       ['Cancelled',String(f.cancelled),'of '+f.attempts+' attempts']]
      .map(([l,v,n])=>card(`<div class="p-4"><p class="text-xs text-nature-500">${l}</p><p class="mt-1 text-2xl font-semibold tnum">${v}</p><p class="text-xs text-nature-400 mt-1 font-mono">${n}</p></div>`)).join('')}
  </div>
  <div class="grid gap-4 lg:grid-cols-2">
    ${card(`<div class="p-4">${sectionHead('Booking funnel')}
      <div class="space-y-3">${stages.map(([l,v])=>`<div>
        <div class="flex justify-between text-sm"><span>${l}</span><span class="tnum font-medium">${v.toLocaleString('en-IN')}</span></div>
        <div class="mt-1 h-2 rounded-full bg-nature-200 overflow-hidden"><div class="h-full bg-forest-600" style="width:${top?Math.max(v/top*100,0.6):0}%"></div></div></div>`).join('')}</div>
      <p class="text-xs text-nature-500 mt-3">The confirmed ÷ attempts rate needs no view data, so it is correct from the first booking. The view-based rates only become meaningful once <code class="font-mono">trip_daily_views</code> has accumulated.</p>
    </div>`)}
    ${card(`<div class="p-4">${sectionHead('Per-trip traffic', `<span class="text-xs text-nature-500 font-mono">trip_daily_views</span>`)}</div>
    ${table([{t:'Trip'},{t:'Views',right:true},{t:'Enquiries',right:true},{t:'Rate',right:true}], views.map(v=>

/* ---- G-06 · assignments, due dates, outstanding, overdue reminders ---- */
V.assignments = () => {
  const vps = vendorPayments();
  const total = vps.reduce((s,v)=>s+v.total_amount,0);
  const paid  = vps.reduce((s,v)=>s+paidAmount(v),0);
  const over  = vps.filter(v=>vendorPayStatus(v)==='overdue');
  const soon  = vps.filter(dueSoon);
  const TONE_FOR = { paid:'green', partial:'amber', pending:'slate', overdue:'red' };

  const alerts = (over.length || soon.length) ? `
    <div class="rounded-xl border ${over.length?'border-red-200 bg-red-50':'border-earth-200 bg-earth-50'} p-4 mb-4">
      <p class="font-medium ${over.length?'text-red-800':'text-earth-900'}">
        ${over.length ? `${over.length} vendor payment${over.length>1?'s are':' is'} overdue` : `${soon.length} payment${soon.length>1?'s':''} due within ${DUE_SOON_DAYS} days`}
      </p>
      <ul class="mt-2 space-y-1 text-sm ${over.length?'text-red-800':'text-earth-900'}">
        ${over.concat(soon.filter(s=>!over.includes(s))).slice(0,4).map(v=>`<li>· <strong>${v.vendor}</strong> — ${INR(outstanding(v))} outstanding on ${v.trip}, due ${dstr(v.due_date)}</li>`).join('')}
      </ul>
    </div>` : '';

  return `
    <div class="grid gap-4 sm:grid-cols-4 mb-4">
      ${[['Committed',INR(total)],['Paid',INR(paid)],['Outstanding',INR(round2(total-paid))],['Overdue',over.length]]
        .map(([l,v])=>card(`<div class="p-4"><p class="text-xs text-nature-500">${l}</p><p class="mt-1 text-2xl font-semibold tnum">${v}</p></div>`)).join('')}
    </div>
    ${alerts}
    ${card(`<div class="p-4">${sectionHead('Vendor payments', `<div class="flex gap-2">${btn('Send due reminders','ghost','onclick="sendDueReminders()"')}${btn('+ Assign vendor','primary','onclick="toast(&#39;Assignment drawer — POST /vendor-assignments&#39;)"')}</div>`)}</div>
      ${table([{t:'Departure'},{t:'Vendor'},{t:'Role'},{t:'Agreed'},{t:'Paid'},{t:'Outstanding'},{t:'Due'},{t:'Status'},{t:'',right:true}], vps.map(v=>{
        const st = vendorPayStatus(v), pd = paidAmount(v);
        return td(`<span class="font-medium">${v.trip}</span>`)+td(v.vendor)+td(`<span class="text-sm text-nature-600">${v.role}</span>`)+
          td(`<span class="tnum">${INR(v.total_amount)}</span>`)+
          td(`<span class="tnum">${INR(pd)}</span>${fillBar(Math.round(pd/v.total_amount*100))}`)+
          td(`<span class="tnum ${outstanding(v)>0?'font-medium':''}">${INR(outstanding(v))}</span>`)+
          td(`<span class="text-xs ${st==='overdue'?'text-red-600 font-medium':'text-nature-600'}">${dstr(v.due_date)}</span>`)+
          td(badge(st.charAt(0).toUpperCase()+st.slice(1), TONE_FOR[st]))+
          td(`<div class="flex gap-1.5 justify-end">
              <button onclick="openPayHistory('${v.id}')" class="px-2.5 h-8 rounded-md bg-nature-100 hover:bg-nature-200 text-xs">History (${v.history.length})</button>
              ${outstanding(v)>0?btn('Record','primary',`onclick="openRecordPayment(&#39;${v.id}&#39;)"`):''}</div>`,'text-right');
      }))}
      <div class="px-4 py-3 border-t border-nature-200 text-xs text-nature-500 space-y-1">
        <p><code class="font-mono">paid</code> is the sum of the append-only history rows and <code class="font-mono">outstanding</code> is <code class="font-mono">total − paid</code> — neither is stored twice, matching the spec's generated column.</p>
        <p><strong>Assumption flagged:</strong> the spec lists <code class="font-mono">partial</code> and <code class="font-mono">overdue</code> as separate statuses but does not say which wins when a part-paid payment is past due. This shows <code class="font-mono">overdue</code>, as the more actionable of the two.</p>
      </div>`)}`;
};

function renderNav(active){
  // only render groups that have at least one screen this role may see
  document.getElementById('nav').innerHTML = NAV.map(g=>{
    const items = g.items.filter(it => can(it.cap));
    if (!items.length) return '';
    return `<div>
      <p class="px-2 mb-1.5 text-[11px] font-semibold uppercase tracking-wider text-nature-400">${g.group}</p>
      <div class="space-y-0.5">
        ${items.map(it=>`<a href="#${it.id}" class="flex items-center gap-2.5 px-2.5 h-9 rounded-md ${it.id===active?'bg-forest-50 text-forest-800 font-medium':'text-nature-600 hover:bg-nature-100'}">
          ${ico(it.icon, it.id===active?'text-forest-700':'text-nature-400')}<span class="truncate">${it.label}</span></a>`).join('')}
      </div></div>`;
  }).join('');
}
const ALL = NAV.flatMap(g=>g.items);
function route(){
  const id = (location.hash.replace('#','') || 'dashboard');
  let meta = ALL.find(i=>i.id===id) || ALL[0];
  renderNav(meta.id);
  document.getElementById('pageTitle').textContent = meta.label;
  document.getElementById('pageSub').textContent = meta.sub;

  // gate on direct hash access too — hiding the nav link alone is not authorization
  const body = can(meta.cap)
    ? (V[meta.id] || (()=>emptyState('Not built yet','This screen is part of the template scope.')))()
    : card(`<div class="p-4">${emptyState('Not available for your role',
        `“${meta.label}” needs the <strong>${(PERMS[meta.cap]||[]).map(r=>ROLE_LABEL[r]).join(' or ')}</strong> role. You are signed in as ${ROLE_LABEL[ROLE]}.`,

/* Shared shape for every generator: refuse on quota, note a cache hit, and
   never mutate the trip. */
function aiRun(feature, inputs, onOutput){
  const r = aiGenerate(feature, inputs);
  if (!r.ok) { toast('Daily quota exhausted — the request was refused before reaching the provider.'); route(); return null; }
  onOutput(r.output, r.cached);
  toast(r.cached ? 'Served from cache — no provider call, no tokens billed.' : 'Draft generated. Nothing has changed on the trip yet.');
  route();
  return r;
}

    STORE.set('aiTripDescriptionDrafts', descriptionDrafts().concat({

      generated_text:out.text, status:'draft', created_at:Date.now(), accepted_at:null, cached }));

};

      based_on:{ current_price:t.price, occupancy_pct:occ.pct==null?'unknown':occ.pct, destination:t.destination },
      status:'suggested', created_at:Date.now(), resolved_at:null, cached }));

window.acceptPricing = function(id){

    status:'suggested', created_at:Date.now() }))));

window.confirmInvite = function(){
  const email = (document.getElementById('invEmail').value || '').trim().toLowerCase();
  const role  = document.getElementById('invRole').value;
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { toast('Enter a valid email address.'); return; }
  const rows = members();
  const live = rows.find(m => m.invited_email===email && m.status!=='revoked' && !inviteExpired(m));
  if (live) { toast(`${email} already has a ${memberStatus(live)} membership.`); return; }
  rows.push({ id:'om'+Date.now(), owning_organizer_id:'demo-org', user_id:null, permission_role:role,
    status:'invited', invited_email:email, name:null,
    invite_token:'tok_'+Math.random().toString(36).slice(2,10),
    invite_expires_at:Date.now()+INVITE_TTL_DAYS*DAY, invited_by:'u-owner', created_at:Date.now() });
  STORE.set('organizationMembers', rows);
  document.getElementById('modal').hidden = true;
  toast(`Invite sent to ${email}, valid ${INVITE_TTL_DAYS} days.`);
  route();
};
window.acceptInvite = function(id){
  const rows = members();
  const m = rows.find(x=>x.id===id); if (!m) return;
  if (inviteExpired(m)) { toast('That token expired — resend the invite instead.'); return; }
  /* Partial UNIQUE(user_id) WHERE status='active': one active membership per
     staff user. Simulated here by the email, which is the identity we have. */
  const clash = rows.find(x => x.status==='active' && x.invited_email===m.invited_email);
  if (clash) { toast('That person already has an active membership.'); return; }
  m.status = 'active';
  m.user_id = 'u-' + m.invited_email.split('@')[0];
  m.name = m.invited_email.split('@')[0].replace(/^./, c=>c.toUpperCase()) + '.';
  m.invite_token = null;                 // cleared on acceptance, per the spec
  m.invite_expires_at = null;
  STORE.set('organizationMembers', rows);
  toast(`${m.name} joined as ${ROLE_LABEL[m.permission_role]}. Token cleared.`);
  route();
};
window.resendInvite = function(id){
  const rows = members();
  const m = rows.find(x=>x.id===id); if (!m) return;
  m.invite_token = 'tok_'+Math.random().toString(36).slice(2,10);
  m.invite_expires_at = Date.now() + INVITE_TTL_DAYS*DAY;
  m.status = 'invited';
  STORE.set('organizationMembers', rows);
  toast('New token issued — the old one stays dead.');
  route();
};
window.revokeMember = function(id){
  const rows = members();
  const m = rows.find(x=>x.id===id); if (!m) return;
  m.status = 'revoked'; m.invite_token = null;
  STORE.set('organizationMembers', rows);
  /* Revoking a leader must drop their assignments, or a revoked account keeps
     appearing as the person responsible for a departure. */
  const dropped = leaderAssignments().filter(a => a.organization_member_id===id).length;
  if (dropped) STORE.set('tripLeaderAssignments', leaderAssignments().filter(a => a.organization_member_id!==id));
  toast(dropped ? `Revoked, and removed from ${dropped} departure${dropped===1?'':'s'}.` : 'Access revoked.');
  route();
};
window.assignLeader = function(tripId, memberId){
  if (!memberId) return;
  const rows = leaderAssignments();
  if (rows.find(a => a.trip_id===tripId && a.organization_member_id===memberId)) {
    toast('Already leading that departure.'); return;      // UNIQUE(trip_id, member)
  }
  rows.push({ id:'tla'+Date.now(), trip_id:tripId, organization_member_id:memberId,
              assigned_by:'u-owner', assigned_at:Date.now() });
  STORE.set('tripLeaderAssignments', rows);
  emitIntegrationEvent('trip_leader_assigned', { trip_id:tripId, member_id:memberId });
  const m = memberById(memberId);
  toast(`${m.name} assigned. They can now see this departure.`);
  route();
};
window.unassignLeader = function(tripId, memberId){
  STORE.set('tripLeaderAssignments',
    leaderAssignments().filter(a => !(a.trip_id===tripId && a.organization_member_id===memberId)));
  toast('Removed — this departure is now invisible to them.');
  route();
};

  toast(`Requests will schedule ${v} day${v===1?'':'s'} after a trip ends.`);
  route();
};

  const n = generateReviewRequests();
  toast(n ? `${n} request${n===1?'':'s'} scheduled.` : 'Nothing eligible.');
  route();
};
window.sendReviewRequest = function(id){
  const rows = reviewRequests(); const r = rows.find(x=>x.id===id); if (!r) return;
  if (!reviewRequestDue(r)) { toast(`Not due until ${DATE_IN(r.scheduled_at)}.`); return; }
  r.status = 'sent'; r.campaign_recipient_id = 'cr'+Date.now();
  STORE.set('reviewRequests', rows);
  toast('Sent through the campaign pipeline.'); route();
};
window.skipReviewRequest = function(id){
  const rows = reviewRequests(); const r = rows.find(x=>x.id===id); if (!r) return;
  r.status = 'skipped'; STORE.set('reviewRequests', rows);
  toast('Skipped — it will not be sent.'); route();
};
window.sendDueRequests = function(){
  const rows = reviewRequests();
  let n = 0;
  rows.filter(reviewRequestDue).forEach(r => { r.status='sent'; r.campaign_recipient_id='cr'+Date.now()+n; n++; });
  STORE.set('reviewRequests', rows);
  toast(n ? `${n} request${n===1?'':'s'} sent.` : 'Nothing due.');
  route();
};
window.runReviewRelay = function(){
  /* The relay reads the reviews table by booking_id — a cross-module query,
     not an event subscription, since that spec publishes no event contract. */
  const rows = reviewRequests();
  let n = 0;
  rows.filter(r => r.status==='sent').forEach(r => { if (reviewExistsFor(r)) { r.status='review_submitted'; n++; } });
  STORE.set('reviewRequests', rows);
  toast(n ? `${n} review${n===1?'':'s'} matched back to a request.` : 'No new reviews found for sent requests.');
  route();
};

/* ---- G-31 · integration actions ---- */
window.connectProvider = function(provider){
  if (PLATFORM_PROVIDERS.includes(provider)) { toast('That runs on platform credentials — there is nothing for you to connect.'); return; }
  const rows = connections();
  let c = rows.find(x => x.provider===provider);
  if (!c) { c = { id:'ic'+Date.now(), organizer_id:'demo-org', provider, config:{} }; rows.push(c); }
  c.status = 'connected';
  c.external_account_id = c.external_account_id || 'ops@trektribe.in';
  c.connected_by = 'u-owner'; c.connected_at = Date.now(); c.last_error = null;
  STORE.set('integrationConnections', rows);
  toast(OAUTH_PROVIDERS.includes(provider)
    ? `${PROVIDER_LABEL[provider]} connected — tokens stored encrypted in oauth_credentials.`
    : `${PROVIDER_LABEL[provider]} connected.`);
  route();
};
window.disconnectProvider = function(provider){
  const rows = connections();
  const c = rows.find(x => x.provider===provider); if (!c) return;
  c.status = 'not_connected'; c.connected_at = null; c.last_synced_at = null; c.last_error = null;
  STORE.set('integrationConnections', rows);
  /* Dropping the connection must drop its sync map too, or a later reconnect
     would try to update calendar events that are no longer ours. */
  if (provider === 'google_calendar') {
    const n = calendarSyncEvents().filter(e => e.integration_connection_id===c.id).length;
    STORE.set('calendarSyncEvents', calendarSyncEvents().filter(e => e.integration_connection_id!==c.id));
    toast(n ? `Disconnected, and ${n} sync mapping${n===1?'':'s'} cleared.` : 'Disconnected.');
  } else toast('Disconnected. Stored tokens discarded.');
  route();
};
window.pushAllTrips = function(){
  let created = 0, updated = 0;
  tripRows().filter(t => !hasDeparted(t)).forEach(t => {
    const r = pushTripToCalendar(t.id);
    if (r.ok) (r.mode === 'created' ? created++ : updated++);
  });
  emitIntegrationEvent('trip_updated', { pushed:created+updated });
  toast(`${created} created, ${updated} updated — a repeat push never duplicates.`);
  route();
};

window.saveGst = function(){
  const gstin = document.getElementById('gpGstin').value.trim().toUpperCase();
  const name  = document.getElementById('gpName').value.trim();
  const addr  = document.getElementById('gpAddr').value.trim();
  const code  = document.getElementById('gpCode').value.trim().toUpperCase();
  const existing = gstProfile();

  if (!name){ toast('Legal business name is required'); return; }
  if (!addr){ toast('Registered address is required'); return; }
  if (gstin && !GSTIN_RE.test(gstin)){
    document.getElementById('gpGstinMsg').innerHTML = '<span class="text-red-600">Not a valid GSTIN format (2 digits, 5 letters, 4 digits, letter, alphanumeric, Z, alphanumeric).</span>';
    toast('GSTIN format is invalid'); return;
  }
  if (!existing.short_code && !/^[A-Z0-9]{1,4}$/.test(code)){
    toast('Short code must be 1–4 letters or digits'); return;
  }
  /* Decision D7 (2026-08-22). Guard the handler, not only the dropdown — a
     disabled <option> stops a click, it does not stop a saved value arriving from
     a restored form, a script, or a future code path.

     Rule 33 is pure-agent VALUATION and stops applying the moment a margin is
     added to a procured item. An operator who buys vendor services, marks them up
     and sells one package price is not a pure agent, so the scheme does not apply
     to them — and selecting it would tax a smaller base than owed on every
     invoice, quietly, until someone asks.
     See docs/research/2026-08-21-gst-verification.md. */
  const scheme = document.getElementById('gpScheme').value;
  if (scheme === 'margin_18pct' && !STORE.get('marginSchemeApproved', false)){
    toast('The 18% margin scheme needs written CA sign-off before it can be selected');
    return;
  }
  STORE.set('gst', {
    legal_business_name:name, gstin, address:addr,
    home_state: document.getElementById('gpState').value,
    short_code: existing.short_code || code,          // immutable once set
    tax_scheme: scheme,
    default_sac_code: document.getElementById('gpSac').value,
  });
  toast('GST profile saved'); route();
};

window.confirmIssue = function(){
  const p = gstProfile();
  const b = MOCK.bookings.find(x=>x.id===document.getElementById('ivBooking').value);
  const pos = document.getElementById('ivPos').value;
  const buyerGstin = document.getElementById('ivGstin').value.trim().toUpperCase();
  if (buyerGstin && !GSTIN_RE.test(buyerGstin)){ toast('Buyer GSTIN format is invalid'); return; }

  let margin = 0;
  if (p.tax_scheme === 'margin_18pct'){
    margin = Number(document.getElementById('ivMargin').value || 0);
    if (!(margin > 0)){ toast('Enter the margin for this booking'); return; }
    if (margin > b.amount){ toast('Margin cannot exceed the package price'); return; }
  }

  const t = computeTax({ scheme:p.tax_scheme, gross:b.amount, margin, placeOfSupply:pos, homeState:p.home_state });
  const now = new Date(), fy = financialYear(now);
  const inv = {
    id:'GI-' + Date.now(), bookingId:b.id,
    number: nextInvoiceNumber(p.short_code, fy), fy,
    date: now.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' }),
    // seller values are SNAPSHOTTED here — later profile edits must not rewrite this invoice
    seller_snapshot: { name:p.legal_business_name, gstin:p.gstin, address:p.address, state:p.home_state, scheme:p.tax_scheme, sac:p.default_sac_code },
    buyer_name:b.traveller, buyer_gstin:buyerGstin || null,
    place_of_supply:pos, gross:b.amount, margin,
    taxable:t.taxable, rate:t.rate, cgst:t.cgst, sgst:t.sgst, igst:t.igst, tax:t.tax, total:t.total, intra:t.intra,
    status:'issued', trip:b.trip,
  };
  STORE.set('invoices', invoices().concat(inv));
  document.getElementById('modal').hidden = true;
  toast('Invoice ' + inv.number + ' issued');
  if (location.hash.replace('#','') !== 'invoices') location.hash = 'invoices'; else route();
};

window.runCouponTest = function(){
  const codes = [...document.getElementById('ctCode').selectedOptions].map(o=>o.value);
  if (!codes.length){ toast('Pick at least one coupon'); return; }
  const b = MOCK.bookings.find(x=>x.id===document.getElementById('ctBooking').value);
  const r = applyCoupons(codes, b, document.getElementById('ctFirst').checked);

  /* D6: stacking has no cap (O1 is unanswered). Showing the total only in rupees
     hides how far it has gone — ₹24,350 does not read as alarming, 22.3% does. */
  const HIGH = 25;
  const applied = r.lines.filter(l=>l.ok), rejected = r.lines.filter(l=>!l.ok);

  document.getElementById('ctOut').innerHTML = `
    ${applied.length ? `<div class="rounded-lg bg-forest-50 border border-forest-200 p-3 text-sm">
      <p class="font-medium text-forest-900">${applied.length} coupon${applied.length===1?'':'s'} applied</p>

        ${applied.map(l=>`<div class="flex justify-between">
          <span>${l.code} <span class="text-forest-700/70">· ${l.scope}${l.capped?' · hit the cap':''}</span></span>

        <div class="flex justify-between pt-1 border-t border-forest-200">
          <span>Total discount</span>
          <span class="tnum font-medium">−${INR(r.totalDiscount)}
            <span class="${r.pct>=HIGH?'text-red-600 font-semibold':'text-forest-700/70'}">· ${r.pct}%</span></span></div>
        <div class="flex justify-between font-semibold"><span>Payable</span><span class="tnum">${INR(r.net)}</span></div>
      </div>
      ${r.pct>=HIGH?`<p class="text-xs text-red-700 mt-2">Over ${HIGH}% off. <strong>There is no cap on stacked coupons yet</strong> — this is what the total reached, not a limit being enforced.</p>`:''}
      ${r.floored?`<p class="text-xs text-red-700 mt-2">The coupons exceeded the booking value. Payable floored at ₹0.</p>`:''}
    </div>` : ''}
    ${rejected.length ? `<div class="rounded-lg bg-earth-50 border border-earth-200 p-3 text-sm text-earth-900 ${applied.length?'mt-2':''}">

    </div>` : ''}`;
};

        <p class="text-nature-800">${c.snapshot}</p>
      </div>
      <p class="text-xs text-nature-500">This exact text is what a resend would send — it is not re-rendered from the current template.</p>
    </div>
    <div class="mt-5 pt-4 border-t border-nature-200 flex justify-end gap-2">${btn('Close','primary','data-close')}</div>`);
};

window.resendComm = function(id){
  const all = vendorComms();
  const c = all.find(x=>x.id===id); if (!c) return;
  all.push({ ...c, id:'vc'+Date.now(), sent_at:Date.now(), status:'sent' });   // replays the same snapshot
  STORE.set('vendorComms', all);
  toast('Resent to ' + c.vendor + ' using the stored copy');
  route();
};

window.openRecordPayment = function(vpId){
  const vp = vendorPayments().find(v=>v.id===vpId); if (!vp) return;
  openModal('Record payment — ' + vp.vendor, `
    <dl class="grid grid-cols-2 gap-y-2 text-sm mb-4">
      <dt class="text-nature-500">Agreed</dt><dd class="tnum">${INR(vp.total_amount)}</dd>
      <dt class="text-nature-500">Paid so far</dt><dd class="tnum">${INR(paidAmount(vp))}</dd>
      <dt class="text-nature-500">Outstanding</dt><dd class="tnum font-medium">${INR(outstanding(vp))}</dd>
      <dt class="text-nature-500">Due</dt><dd>${dstr(vp.due_date)}</dd>
    </dl>
    <div class="grid gap-3">
      <label class="block"><span class="text-sm font-medium">Amount</span>
        <input id="rpAmt" type="number" value="${outstanding(vp)}" class="mt-1 w-full h-10 rounded-md border border-nature-300 px-3 tnum"/>
        <span class="text-xs text-nature-400">Cannot exceed the outstanding ${INR(outstanding(vp))}.</span></label>
      <label class="block"><span class="text-sm font-medium">Note</span>
        <input id="rpNote" class="mt-1 w-full h-10 rounded-md border border-nature-300 px-3" placeholder="e.g. balance on departure"/></label>
      <label class="flex items-center gap-2.5"><input type="checkbox" id="rpNotify" checked class="w-4 h-4 accent-forest-600"/>
        <span class="text-sm">Notify the vendor (raises <code class="font-mono text-xs">vendor_payment_completed</code>)</span></label>
    </div>
    <div class="mt-5 pt-4 border-t border-nature-200 flex justify-end gap-2">
      ${btn('Cancel','ghost','data-close')}${btn('Record payment','primary',`onclick="confirmRecordPayment(&#39;${vpId}&#39;)"`)}
    </div>`);
};

window.confirmRecordPayment = function(vpId){
  const all = vendorPayments();
  const vp = all.find(v=>v.id===vpId);
  const amt = Number(document.getElementById('rpAmt').value || 0);
  if (!(amt > 0)){ toast('Enter an amount greater than zero'); return; }
  if (amt > outstanding(vp)){ toast(`Cannot exceed the outstanding ${INR(outstanding(vp))}`); return; }

  vp.history.push({ amount:round2(amt), paid_at:Date.now(), note:document.getElementById('rpNote').value.trim() || 'Payment recorded' });
  STORE.set('vendorPayments', all);
  const notify = document.getElementById('rpNotify').checked;
  document.getElementById('modal').hidden = true;

  if (notify){
    const before = vendorComms().length;
    fireVendorEvent('vendor_payment_completed', vp.trip);
    const sent = vendorComms().length - before;
    toast(`${INR(amt)} recorded · ${sent} vendor notification${sent===1?'':'s'} raised`);
  } else {
    toast(`${INR(amt)} recorded — ${INR(outstanding(vp))} still outstanding`);
  }
  route();
};

window.openPayHistory = function(vpId){
  const vp = vendorPayments().find(v=>v.id===vpId); if (!vp) return;
  openModal('Payment history — ' + vp.vendor, `
    ${vp.history.length ? `<div class="divide-y divide-nature-100">
      ${vp.history.slice().reverse().map(h=>`<div class="flex justify-between gap-4 py-2.5">
        <div><p class="font-medium tnum">${INR(h.amount)}</p><p class="text-xs text-nature-500">${h.note}</p></div>
        <span class="text-xs text-nature-500 whitespace-nowrap">${dstr(h.paid_at)}</span></div>`).join('')}
      </div>
      <div class="flex justify-between gap-4 pt-3 mt-2 border-t border-nature-300 text-sm">
        <span class="font-semibold">Paid</span><span class="font-semibold tnum">${INR(paidAmount(vp))} of ${INR(vp.total_amount)}</span></div>`
      : `<p class="text-sm text-nature-500 py-6 text-center">Nothing paid yet against this assignment.</p>`}
    <p class="text-xs text-nature-500 mt-3">This table is append-only — corrections are new rows, never edits, so the paid total always reconciles.</p>
    <div class="mt-5 pt-4 border-t border-nature-200 flex justify-end gap-2">${btn('Close','primary','data-close')}</div>`);
};

window.sendDueReminders = function(){
  const due = vendorPayments().filter(v=>vendorPayStatus(v)==='overdue' || dueSoon(v));
  if (!due.length){ toast('Nothing due — no reminders to send'); return; }
  const trips = [...new Set(due.map(v=>v.trip))];
  trips.forEach(t=>fireVendorEvent('pre_departure_reminder', t));
  toast(`Reminders raised for ${due.length} payment${due.length>1?'s':''} across ${trips.length} departure${trips.length>1?'s':''}`);
  route();
};

window.resetPhase1 = function(){ STORE.reset(); ROLE='owner'; roleSel.value='owner'; toast('Phase 1 demo data cleared'); route(); };

route();
</script>
</body>
</html>
