<body class="bg-nature-100 text-nature-900 font-sans text-[15px] antialiased">

<div class="flex min-h-screen">

  <!-- ================= SIDEBAR ================= -->
  <aside id="sidebar" class="w-64 shrink-0 bg-white border-r border-nature-200 flex flex-col fixed inset-y-0 left-0 z-40 -translate-x-full lg:translate-x-0 transition-transform">
    <div class="h-16 flex items-center gap-2.5 px-5 border-b border-nature-200">
      <div class="w-8 h-8 rounded-lg bg-forest-600 text-white grid place-items-center font-bold">T</div>
      <div class="leading-tight">
        <div class="font-semibold text-sm">TrekTribe</div>
        <div class="text-[11px] text-nature-500">Organizer OS</div>
      </div>
    </div>

    <nav id="nav" class="flex-1 overflow-y-auto py-4 px-3 space-y-5 text-sm"></nav>

    <div class="p-3 border-t border-nature-200">

      </div>
    </div>
  </aside>

  <!-- ================= MAIN ================= -->
  <div class="flex-1 lg:pl-64 min-w-0">

    <header class="h-16 bg-white/90 backdrop-blur border-b border-nature-200 sticky top-0 z-30 flex items-center gap-3 px-4 sm:px-6">
      <button id="menuBtn" class="lg:hidden p-2 -ml-2 rounded-md hover:bg-nature-100" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>

      <div class="min-w-0">
        <h1 id="pageTitle" class="font-semibold truncate">Dashboard</h1>
        <p id="pageSub" class="text-xs text-nature-500 truncate">—</p>
      </div>

      <div class="ml-auto flex items-center gap-2">
        <div class="hidden md:flex items-center gap-2 bg-nature-100 rounded-md px-3 h-9 w-64">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-nature-400"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input placeholder="Search trips, leads, vendors…" class="bg-transparent text-sm outline-none w-full placeholder:text-nature-400" />
        </div>
        <!-- role switcher: demonstrates FR-17 / NFR-6 gating live -->
        <label class="hidden sm:flex items-center gap-1.5 text-xs text-nature-500">
          <span class="uppercase tracking-wide">Role</span>
          <select id="roleSel" class="h-9 rounded-md border border-nature-300 bg-white px-2 text-sm text-nature-800">
            <option value="owner">Owner</option>
            <option value="operations">Operations</option>
            <option value="finance">Finance</option>
            <option value="marketing">Marketing</option>
            <option value="trip_leader">Trip leader</option>
          </select>
        </label>
        <button class="relative p-2 rounded-md hover:bg-nature-100" aria-label="Notifications">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-red-500 ring-2 ring-white"></span>
        </button>
        <div class="flex items-center gap-2 pl-2 border-l border-nature-200">
          <div class="w-8 h-8 rounded-full bg-forest-600 text-white grid place-items-center text-xs font-semibold">DO</div>
          <div class="hidden sm:block leading-tight">
            <div class="text-xs font-semibold">Demo Organizer</div>
            <div class="text-[11px] text-nature-500">Verified</div>
          </div>
        </div>
      </div>
    </header>

    <main id="view" class="p-4 sm:p-6 max-w-[1500px]"></main>
  </div>
</div>

<!-- backdrop for mobile sidebar -->
<div id="backdrop" class="fixed inset-0 bg-nature-900/40 z-30 lg:hidden" hidden></div>

<!-- modal -->
<div id="modal" class="fixed inset-0 z-50 grid place-items-center p-4" hidden>

</div>

<!-- toast -->
<div id="toast" class="fixed bottom-5 right-5 z-50 bg-nature-900 text-white text-sm px-4 py-2.5 rounded-lg shadow-lg" hidden></div>

/* Rule 46(b): unique + consecutive per financial year. '2526' = FY2025-26. */
function financialYear(d){
  const y = d.getFullYear(), startY = d.getMonth() >= 3 ? y : y - 1;   // FY starts April
  return String(startY % 100).padStart(2,'0') + String((startY+1) % 100).padStart(2,'0');
}
function nextInvoiceNumber(shortCode, fy){
  const c = STORE.get('counters', {});
  c[fy] = (c[fy] || 0) + 1;                     // per-FY counter, resets each FY
  STORE.set('counters', c);
  return `${shortCode}/${fy}/${String(c[fy]).padStart(5,'0')}`;   // 15 chars ≤ Rule 46(b) cap of 16
}

/* gross_5pct → 5% of the full package, no ITC.
   margin_18pct → 18% of the operator's margin only (CGST Rule 33).
   Intra-state splits CGST+SGST; inter-state is IGST. Exactly one applies. */
function computeTax({ scheme, gross, margin, placeOfSupply, homeState }){
  const taxable = scheme === 'gross_5pct' ? gross : margin;
  const rate    = scheme === 'gross_5pct' ? 5 : 18;
  const tax     = Math.round(taxable * rate) / 100;
  const intra   = placeOfSupply === homeState;
  return {
    taxable, rate,
    cgst: intra ? Math.round(tax*50)/100 : 0,
    sgst: intra ? Math.round(tax*50)/100 : 0,
    igst: intra ? 0 : tax,
    tax,
    // under the margin scheme the traveller still pays the gross package; tax sits on the margin
    total: Math.round((gross + tax) * 100) / 100,
    intra,
  };
}

}

/* status is DERIVED on read from dates + counts — the spec is explicit that it
   is not a separately-maintained flag, to avoid a denormalized value going stale */
function couponStatus(c){
  const now = Date.now();
  if (c.max_total_redemptions != null && c.total_redeemed >= c.max_total_redemptions) return 'exhausted';
  if (c.ends_at   && c.ends_at   < now) return 'expired';
  if (c.starts_at && c.starts_at > now) return 'inactive';
  return 'active';
}

/* real eligibility + discount computation, incl. the percentage cap */
function applyCoupon(c, booking, isFirstBooking){
  const st = couponStatus(c);
  if (st !== 'active') return { ok:false, reason:`Coupon is ${st}` };
  if (c.trip_id && c.trip_id !== booking.trip) return { ok:false, reason:`Only valid on ${c.trip_id}` };
  if (c.min_booking_amount && booking.amount < c.min_booking_amount)
    return { ok:false, reason:`Needs a booking of at least ${INR(c.min_booking_amount)}` };
  if (c.first_booking_only && !isFirstBooking) return { ok:false, reason:'First booking only' };

  let d = c.discount_type === 'percentage' ? booking.amount * c.value / 100 : c.value;
  let capped = false;
  if (c.discount_type === 'percentage' && c.max_discount_amount != null && d > c.max_discount_amount){
    d = c.max_discount_amount; capped = true;
  }
  d = Math.min(d, booking.amount);
  return { ok:true, discount:round2(d), payable:round2(booking.amount - d), capped };
}

/* ---- G-07 · payout tranches ----
   advance gross = round(total * 0.6, 2); balance gross = total − advance
   (the REMAINDER, not an independently computed 40%) so the two rows always
   sum to exactly total_amount with no rounding drift. Commission splits by
   the identical direct/remainder technique. net is gross − commission. */
function buildPayouts(booking, tripStart, capturedAt){
  const pct = commissionPct('demo-org');
  const total = booking.amount;
  const advGross = round2(total * 0.6);
  const balGross = round2(total - advGross);
  const totalComm = round2(total * pct / 100);
  const advComm = round2(totalComm * 0.6);
  const balComm = round2(totalComm - advComm);
  const mk = (tranche, gross, comm, due, status) => ({
    booking_id:booking.id, trip:booking.trip, tranche,
    commission_pct_applied:pct, gross_amount:gross, commission_amount:comm,
    net_amount:round2(gross - comm), due_at:due, status,
  });
  return [
    mk('advance', advGross, advComm, capturedAt + DAY, booking.pay === 'Verified' ? 'completed' : 'pending'),
    mk('balance', balGross, balComm, tripStart, tripStart < Date.now() ? 'pending' : 'pending'),
  ];
}

     `trip_templates`  — id, organizer_id, name, title, destination,
                         description, itinerary, price, duration_days,
                         inclusions, exclusions
     `trip_series`     — id, organizer_id, series_name, title, destination,
                         description, itinerary, base_price, template_id?
     `trips` ALTER     — status enum, publish_at, series_id, template_id,
                         duplicated_from_trip_id
   A template is never customer-visible and never bookable. A series is a
   recipe; only the departures it stamps out are real, sellable trips.
   ========================================================================== */

const TRIP_STATUS = ['draft','scheduled','published'];   // spec enum, verbatim

/* Trips move into STORE here so publish / schedule / duplicate actually mutate
   state instead of re-rendering a constant. Seeded from MOCK.trips so every
   other screen keeps reading the same departures it always did. */
function seedTrips(){
  const dest = { 'TRIP.01':'Zanskar, Ladakh', 'TRIP.02':'Kashmir', 'TRIP.03':'Sikkim',
                 'TRIP.04':'Himachal',        'TRIP.05':'Ladakh' };
  /* max_participants is nullable per the booking spec. TRIP.03 deliberately has
     no cap so v_occupancy_by_trip's "capacity data unavailable" branch is
     reachable rather than theoretical. */
  const cap  = { 'TRIP.01':8, 'TRIP.02':8, 'TRIP.03':null, 'TRIP.04':8, 'TRIP.05':8 };
  /* Departures are placed relative to today, not on fixed calendar dates. A
     hard-coded 2026 date silently turns every trip "Past" once that date
     passes, which is how a demo quietly stops demonstrating anything. */
  const inDays = { 'TRIP.01':30, 'TRIP.02':55, 'TRIP.03':121, 'TRIP.04':38, 'TRIP.05':14 };
  return MOCK.trips.map(t => {
    const start = Date.now() + inDays[t.code]*DAY;
    return {
    id:t.code, code:t.code, name:t.name, dep:DATE_IN(start), days:t.days,
    seats:t.seats, fill:t.fill, price:t.price,
    destination:dest[t.code], start_date:start,
    max_participants:cap[t.code],
    status: t.status === 'Draft' ? 'draft' : 'published',
    publish_at:null, series_id:null, template_id:null, duplicated_from_trip_id:null,
    }; }).concat(pastDepartures());
}

/* Last season's departures. A 2025 Markha run is a DIFFERENT trip from the 2026
   one, not the same row seen twice — modelling it as one would let a closed
   season's bookings count against this season's seats. */
function pastDepartures(){
  return [
    { id:'TRIP.P1', code:'TRIP.P1', name:'Markha Valley',       ago:371, days:9,
      seats:'8/8', fill:100, price:96000,  destination:'Ladakh' },
    { id:'TRIP.P2', code:'TRIP.P2', name:'Hampta Pass',         ago:410, days:5,
      seats:'8/8', fill:100, price:18500,  destination:'Himachal' },
    { id:'TRIP.P3', code:'TRIP.P3', name:'Goecha La',           ago:303, days:11,
      seats:'6/8', fill:75,  price:109000, destination:'Sikkim' },
    { id:'TRIP.P4', code:'TRIP.P4', name:'Kashmir Great Lakes', ago:422, days:8,
      seats:'7/8', fill:88,  price:74000,  destination:'Kashmir' },
  ].map(t => {
    const start = Date.now() - t.ago*DAY;
    return { ...t, start_date:start, dep:DATE_IN(start), max_participants:8, past:true,
             status:'published', publish_at:null,
             series_id:null, template_id:null, duplicated_from_trip_id:null };
  });
}
function tripRows(){
  let r = STORE.get('trips', null);
  if (!r) { r = seedTrips(); STORE.set('trips', r); }
  return r;
}
const setTrips = rows => STORE.set('trips', rows);

/* A scheduled trip whose publish_at has passed IS published — derived on read,
   so there is no cron job whose failure could leave the flag stale. */
function effectiveStatus(t){
  return (t.status === 'scheduled' && t.publish_at && t.publish_at <= Date.now())
    ? 'published' : t.status;
}
/* Lifecycle status and sell state are two different axes. 'Full'/'Selling' is
   derived from seat fill; keeping it out of the status column stops the two
   meanings collapsing into one field. */
const hasDeparted = t => t.start_date < Date.now();
function sellState(t){
  /* A departure that has already left is not selling anything, whatever its
     seat fill says. Derived from the date so a trip ages out on its own. */
  if (hasDeparted(t)) return 'Past';
  if (effectiveStatus(t) !== 'published') return effectiveStatus(t)==='scheduled' ? 'Scheduled' : 'Draft';
  return t.fill >= 100 ? 'Full' : 'Selling';
}

function publishTrip(id){
  setTrips(tripRows().map(t => t.id===id ? {...t, status:'published', publish_at:null} : t));
}
function scheduleTrip(id, whenMs){
  setTrips(tripRows().map(t => t.id===id ? {...t, status:'scheduled', publish_at:whenMs} : t));
}
function unpublishTrip(id){
  setTrips(tripRows().map(t => t.id===id ? {...t, status:'draft', publish_at:null} : t));
}

/* Derived from the highest code already in use, not from a counter and not
   from row count. A counter resets on reload while the rows persist, which is
   exactly how a "new" trip ends up reusing a live trip's code. */
function nextTripCode(){
  const max = tripRows().reduce((m,t) => {
    const n = parseInt(String(t.code).replace(/^TRIP\./,''), 10);
    return Number.isFinite(n) ? Math.max(m,n) : m;
  }, 0);
  return 'TRIP.' + String(max + 1).padStart(2,'0');
}

function duplicateTrip(id){
  const rows = tripRows(), src = rows.find(t => t.id===id);
  if (!src) return null;
  const code = nextTripCode();
  const copy = { ...src, id:code, code, name:src.name + ' (copy)',
    status:'draft', publish_at:null,          // a duplicate never inherits a live state
    seats:'0/' + (src.max_participants ?? '—'), fill:0,
    series_id:null,                            // a copy is not part of the original's series
    duplicated_from_trip_id:src.id };          // traceability only — no behaviour reads it
  setTrips(rows.concat([copy]));
  return copy;
}

const DATE_IN = ms => new Date(ms).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});

/* Both entry points create a real, draft trip. The difference is only which
   FK gets stamped — template_id (one-off from a shape) or series_id (a
   departure that belongs to a recurring run). */
function tripFromTemplate(templateId, startMs){
  const tpl = templates().find(t => t.id===templateId); if (!tpl) return null;
  const code = nextTripCode();
  const row = { id:code, code, name:tpl.title, dep:DATE_IN(startMs), days:tpl.duration_days,
    seats:'0/8', fill:0, price:tpl.price, destination:tpl.destination,
    start_date:startMs, max_participants:8, status:'draft', publish_at:null,
    series_id:null, template_id:tpl.id, duplicated_from_trip_id:null };
  setTrips(tripRows().concat([row]));
  return row;
}
function departureFromSeries(seriesId, startMs){
  const s = seriesRows().find(x => x.id===seriesId); if (!s) return null;
  const code = nextTripCode();
  const row = { id:code, code, name:s.title, dep:DATE_IN(startMs), days:s.itinerary.length,
    seats:'0/8', fill:0, price:s.base_price, destination:s.destination,
    start_date:startMs, max_participants:8, status:'draft', publish_at:null,
    series_id:s.id, template_id:s.template_id, duplicated_from_trip_id:null };
  setTrips(tripRows().concat([row]));
  return row;
}
const seriesDepartures = seriesId => tripRows().filter(t => t.series_id===seriesId);

/* ==========================================================================
   P2 · G-04 — booking detail
   Spec: 2026-08-05-core-platform-traveler-booking-design.md
     `bookings.status` enum: pending_payment | confirmed | completed | cancelled
     `bookings.num_travelers` — a family of four booking together is ONE row
     `bookings.total_amount`  — snapshot of trips.price * num_travelers at
                                booking time (price lock-in)
     `booking_events.event_type` enum, verbatim below
   ========================================================================== */

const BOOKING_STATUS = ['pending_payment','confirmed','completed','cancelled'];
const BOOKING_EVENTS = ['booking_confirmed','payment_captured','installment_due_soon',
  'cancellation_requested','refund_completed','waitlist_seat_freed','waitlist_offer_expiring'];

const bookingStatusOf = b => ({ Verified:'confirmed', Pending:'pending_payment',
  Refunded:'cancelled' })[b.pay] || 'pending_payment';

/* Price lock-in: total_amount was snapshotted at booking time, so a later trip
   price edit must NOT move it. This returns both figures so the screen can show
   the gap rather than assert the rule. */
function priceLock(b){
  const t = tripRows().find(x => x.id === canonicalTripId(b.trip));
  const locked = b.amount;
  const atCurrent = t ? t.price * b.pax : null;
  return { locked, atCurrent, drifted: atCurrent !== null && atCurrent !== locked, current: t ? t.price : null };
}

/* Timeline derived from status — no separate event log to fall out of sync
   with the booking it describes. */
function bookingTimeline(b){
  const st = bookingStatusOf(b), out = [];
  out.push({ type:'booking_confirmed', when:b.date, note:`${b.pax} seat${b.pax>1?'s':''} held on ${b.trip}` });
  if (st === 'confirmed' || st === 'completed')
    out.push({ type:'payment_captured', when:b.date, note:`${INR(b.amount)} captured via ${b.method}` });
  if (st === 'pending_payment')
    out.push({ type:'installment_due_soon', when:'pending', note:'Awaiting capture — the seat is held, not sold' });
  if (st === 'cancelled') {
    out.push({ type:'cancellation_requested', when:b.date, note:'Traveller requested cancellation' });
    out.push({ type:'refund_completed', when:b.date, note:`${INR(b.amount)} refunded` });
  }
  return out;
}

/* ==========================================================================
   P2 · G-24..G-27 — analytics views
   Spec: 2026-08-05-analytics-financial-design.md. Every number below is
   computed from the same rows the operational screens read. Nothing here is
   a hand-authored figure.
   ========================================================================== */

/* A series stamps out several departures that share a title by design, so a
   trip NAME is not a key. Everything below joins on trip id; the name-keyed
   legacy rows (bookings, vendor payments, expenses) resolve to the canonical
   — earliest-created — trip of that name. Without this, three "Kashmir Great
   Lakes" departures each claim the same booking and the destination rollup
   triple-counts it. */
function canonicalTripId(name){
  const t = tripRows().find(x => x.name === name);
  return t ? t.id : null;
}

/* One row per booking ATTEMPT, not per confirmed booking — a conversion rate
   needs a denominator, so cancelled and pending rows stay in the set. */
function analyticsBookings(){
  const st = { Verified:'confirmed', Pending:'pending_payment', Refunded:'cancelled' };
  const current = MOCK.bookings.map(b => ({
    id:b.id, traveler:b.traveller, trip:b.trip, amount:b.amount,
    status: st[b.pay] || 'pending_payment', at:new Date(b.date + ' 2026').getTime(),
  }));
  /* Prior-season rows, pinned to LAST season's departures by id. Without
     history there is no such thing as a repeat customer; without the pin,
     a closed season's bookings would fill this season's seats. */
  const past = {}; pastDepartures().forEach(t => { past[t.id] = t.start_date; });
  const prior = [
    { id:'BK-1904', traveler:'Rajesh Kumar', trip:'Markha Valley',      trip_id:'TRIP.P1', amount:96000,  status:'confirmed' },
    { id:'BK-1877', traveler:'Priya Sharma', trip:'Hampta Pass',        trip_id:'TRIP.P2', amount:18500,  status:'confirmed' },
    { id:'BK-1852', traveler:'Rajesh Kumar', trip:'Goecha La',          trip_id:'TRIP.P3', amount:109000, status:'confirmed' },
    { id:'BK-1840', traveler:'Sana Khan',    trip:'Kashmir Great Lakes',trip_id:'TRIP.P4', amount:74000,  status:'cancelled' },
    /* Two one-time travellers, so the New bucket is populated and not a branch
       that only exists in theory. Dev Patel has an invoice; Farida Qureshi does
       not, which is how the geography view's stated scope limit gets exercised. */
    { id:'BK-1866', traveler:'Dev Patel',      trip:'Kashmir Great Lakes',trip_id:'TRIP.P4', amount:74000,  status:'confirmed' },
    { id:'BK-1859', traveler:'Farida Qureshi', trip:'Goecha La',          trip_id:'TRIP.P3', amount:109000, status:'confirmed' },
  ].map(b => ({ ...b, at: past[b.trip_id] - 45*DAY }));   // booked ~6 weeks before departure
  return current.concat(prior).map(b => ({ ...b, trip_id: b.trip_id || canonicalTripId(b.trip) }));
}

/* Expenses carry no trip column, so they are attributed through the vendor
   they were paid to. Anything that matches no vendor stays UNATTRIBUTED and is
   surfaced as such — silently folding it into one trip would overstate that
   trip's cost and understate every other. */
function expenseTrip(e){
  const vp = vendorPayments().find(v => v.vendor === e.vendor);
  return vp ? vp.trip : null;
}
const unattributedExpenses = () => MOCK.expenses.filter(e => !expenseTrip(e));

/* v_profitability_by_trip — revenue − expenses − vendor_payments.paid_amount.
   Costs land on the canonical trip only: a departure generated today has not
   incurred the original departure's vendor bills. */
function vProfitabilityByTrip(){
  const bk = analyticsBookings(), vps = vendorPayments();
  return tripRows().map(t => {
    const canonical = canonicalTripId(t.name) === t.id;
    const revenue  = bk.filter(b => b.trip_id===t.id && b.status==='confirmed')
                       .reduce((s,b)=>s+b.amount, 0);
    const expenses = !canonical ? 0 : MOCK.expenses.filter(e => expenseTrip(e)===t.name)
                       .reduce((s,e)=>s+e.amt, 0);
    const vendor   = !canonical ? 0 : vps.filter(v => v.trip===t.name)
                       .reduce((s,v)=>s+paidAmount(v), 0);
    const profit   = revenue - expenses - vendor;
    return { trip:t.name, code:t.code, dep:t.dep, past:hasDeparted(t),
             costsOnRecord: expenses + vendor > 0,
             destination:t.destination, revenue, expenses, vendor, profit,
             margin: revenue ? Math.round(profit / revenue * 1000)/10 : null };
  });
}

/* v_profitable_destinations — the same view rolled up by trips.destination */
function vProfitableDestinations(){
  const acc = {};
  vProfitabilityByTrip().forEach(r => {
    const d = acc[r.destination] || (acc[r.destination] = { destination:r.destination, revenue:0, cost:0, profit:0, trips:0 });
    d.revenue += r.revenue; d.cost += r.expenses + r.vendor; d.profit += r.profit; d.trips += 1;
  });
  return Object.values(acc)
    .map(d => ({ ...d, margin: d.revenue ? Math.round(d.profit / d.revenue * 1000)/10 : null }))
    .sort((a,b) => b.profit - a.profit);
}

/* v_occupancy_by_trip — confirmed bookings vs trips.max_participants.
   A null cap is returned as-is; the UI says "capacity data unavailable"
   rather than dividing by null. */
function vOccupancyByTrip(){
  const bk = analyticsBookings();
  return tripRows().map(t => {
    const booked = bk.filter(b => b.trip_id===t.id && b.status==='confirmed').length;
    return { trip:t.name, booked, cap:t.max_participants,
             pct: t.max_participants ? Math.round(booked / t.max_participants * 100) : null };
  });
}

/* v_seasonal_bookings — grouped by EXTRACT(MONTH FROM trips.start_date),
   aggregated across years */
function vSeasonalBookings(){
  const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const byTrip = {}; tripRows().forEach(t => { byTrip[t.id] = new Date(t.start_date).getMonth(); });
  const counts = new Array(12).fill(0);
  analyticsBookings().forEach(b => {
    const m = byTrip[b.trip_id];
    if (m !== undefined && b.status === 'confirmed') counts[m] += 1;
  });
  return M.map((label,i) => ({ label, count:counts[i] }));
}

/* v_repeat_customers — per traveller: confirmed count, first/last booking,
   lifetime spend. The >1 bucketing is the API layer's job, done here on read. */
function vRepeatCustomers(){
  const acc = {};
  analyticsBookings().filter(b => b.status==='confirmed').forEach(b => {
    const c = acc[b.traveler] || (acc[b.traveler] = { traveler:b.traveler, bookings:0, first:b.at, last:b.at, spend:0 });
    c.bookings += 1; c.spend += b.amount;
    c.first = Math.min(c.first, b.at); c.last = Math.max(c.last, b.at);
  });
  return Object.values(acc)
    .map(c => ({ ...c, segment: c.bookings > 1 ? 'Repeat' : 'New' }))
    .sort((a,b) => b.spend - a.spend);
}

/* v_customer_geography — grouped by the parsed state on gst_invoices.buyer_address.
   Only invoiced (i.e. paid) bookings appear; unpaid ones contribute no revenue
   to analyse. That scope limit is stated in the UI, not hidden. */
const BUYER_STATE = { 'Rajesh Kumar':'Delhi', 'Priya Sharma':'Maharashtra',
  'Amit Singh':'Uttar Pradesh', 'Neha Verma':'Maharashtra', 'Arjun Mehta':'Karnataka',
  'Sana Khan':'Delhi', 'Dev Patel':'Gujarat' };
  /* Farida Qureshi is deliberately absent — a confirmed booking with no invoice
     yet. She counts as a customer and is excluded from geography, which is the
     scope limit the view declares rather than a row quietly going missing. */
function vCustomerGeography(){
  const acc = {};
  analyticsBookings().filter(b => b.status==='confirmed').forEach(b => {
    const state = BUYER_STATE[b.traveler]; if (!state) return;   // no invoice → not counted
    const g = acc[state] || (acc[state] = { state, bookings:0, revenue:0 });
    g.bookings += 1; g.revenue += b.amount;
  });
  return Object.values(acc).sort((a,b) => b.revenue - a.revenue);
}
/* How much confirmed revenue the geography view cannot place. Stated in the UI
   so the map is never mistaken for the whole book. */
function geographyUnplaced(){
  const rows = analyticsBookings().filter(b => b.status==='confirmed' && !BUYER_STATE[b.traveler]);
  return { count:rows.length, revenue:rows.reduce((s,b)=>s+b.amount,0) };
}

/* v_booking_funnel_conversion — confirmed ÷ all attempts. No dependency on
   trip_daily_views, so it is correct from day one. */
function vBookingFunnelConversion(){
  const bk = analyticsBookings();
  const attempts = bk.length, confirmed = bk.filter(b=>b.status==='confirmed').length;
  return { attempts, confirmed,
           pending: bk.filter(b=>b.status==='pending_payment').length,
           cancelled: bk.filter(b=>b.status==='cancelled').length,
           rate: attempts ? Math.round(confirmed / attempts * 1000)/10 : 0 };
}

/* trip_daily_views — the view-count half of the funnel. Real rows in
   production; seeded here so the views→enquiry→booking chain is computable
   rather than asserted. */
const seedTripViews = () => tripRows().slice(0,5).map((t,i) => ({
  trip:t.name, views:[1840, 1210, 760, 320, 690][i] || 0, enquiries:[212,168,96,31,105][i] || 0,
}));
const tripViews = () => STORE.get('tripDailyViews', seedTripViews());

const card = (inner, cls='') => `<div class="bg-white rounded-xl border border-nature-200 ${cls}">${inner}</div>`;

function table(cols, rows){

    <table class="w-full text-sm">
      <thead><tr class="text-left text-[11px] uppercase tracking-wide text-nature-500 border-b border-nature-200">

const td = (v, cls='') => `<td class="px-4 py-3 ${cls}">${v}</td>`;

function bars(data, h=120){
  const max = Math.max(...data), w = 100/data.length;
  return `<svg viewBox="0 0 100 ${h}" preserveAspectRatio="none" class="w-full" style="height:${h}px">
    ${data.map((v,i)=>{const bh=(v/max)*(h-10);return `<rect x="${i*w+w*0.22}" y="${h-bh}" width="${w*0.56}" height="${bh}" rx="0.8" fill="#16a34a" opacity="${0.35+0.65*(i/(data.length-1))}"/>`}).join('')}
  </svg>`;

  ${table([{t:'Trip'},{t:'Destination'},{t:'Revenue',right:true},{t:'Expenses',right:true},{t:'Vendor paid',right:true},{t:'Profit',right:true},{t:'Margin',right:true}], rows.map(r=>
    td(`<span class="font-medium">${r.trip}</span><div class="text-xs text-nature-500">${r.code} · ${r.dep}${r.past?' · departed':''}</div>`)+td(r.destination)+
    td(`<span class="tnum">${INR(r.revenue)}</span>`,'text-right')+

    td(`<span class="tnum">${INR(r.vendor)}</span>`,'text-right')+
    td(`<span class="tnum font-medium ${r.profit<0?'text-red-600':''}">${INR(r.profit)}</span>`,'text-right')+

V.assignments = () => {
  const vps = vendorPayments();
  const total = vps.reduce((s,v)=>s+v.total_amount,0);
  const paid  = vps.reduce((s,v)=>s+paidAmount(v),0);
  const over  = vps.filter(v=>vendorPayStatus(v)==='overdue');
  const soon  = vps.filter(dueSoon);
  const TONE_FOR = { paid:'green', partial:'amber', pending:'slate', overdue:'red' };

  const alerts = (over.length || soon.length) ? `
    <div class="rounded-xl border ${over.length?'border-red-200 bg-red-50':'border-earth-200 bg-earth-50'} p-4 mb-4">
      <p class="font-medium ${over.length?'text-red-800':'text-earth-900'}">
        ${over.length ? `${over.length} vendor payment${over.length>1?'s are':' is'} overdue` : `${soon.length} payment${soon.length>1?'s':''} due within ${DUE_SOON_DAYS} days`}
      </p>
      <ul class="mt-2 space-y-1 text-sm ${over.length?'text-red-800':'text-earth-900'}">
        ${over.concat(soon.filter(s=>!over.includes(s))).slice(0,4).map(v=>`<li>· <strong>${v.vendor}</strong> — ${INR(outstanding(v))} outstanding on ${v.trip}, due ${dstr(v.due_date)}</li>`).join('')}
      </ul>
    </div>` : '';

  return `
    <div class="grid gap-4 sm:grid-cols-4 mb-4">
      ${[['Committed',INR(total)],['Paid',INR(paid)],['Outstanding',INR(round2(total-paid))],['Overdue',over.length]]
        .map(([l,v])=>card(`<div class="p-4"><p class="text-xs text-nature-500">${l}</p><p class="mt-1 text-2xl font-semibold tnum">${v}</p></div>`)).join('')}
    </div>
    ${alerts}
    ${card(`<div class="p-4">${sectionHead('Vendor payments', `<div class="flex gap-2">${btn('Send due reminders','ghost','onclick="sendDueReminders()"')}${btn('+ Assign vendor','primary','onclick="toast(&#39;Assignment drawer — POST /vendor-assignments&#39;)"')}</div>`)}</div>
      ${table([{t:'Departure'},{t:'Vendor'},{t:'Role'},{t:'Agreed'},{t:'Paid'},{t:'Outstanding'},{t:'Due'},{t:'Status'},{t:'',right:true}], vps.map(v=>{
        const st = vendorPayStatus(v), pd = paidAmount(v);
        return td(`<span class="font-medium">${v.trip}</span>`)+td(v.vendor)+td(`<span class="text-sm text-nature-600">${v.role}</span>`)+
          td(`<span class="tnum">${INR(v.total_amount)}</span>`)+
          td(`<span class="tnum">${INR(pd)}</span>${fillBar(Math.round(pd/v.total_amount*100))}`)+
          td(`<span class="tnum ${outstanding(v)>0?'font-medium':''}">${INR(outstanding(v))}</span>`)+
          td(`<span class="text-xs ${st==='overdue'?'text-red-600 font-medium':'text-nature-600'}">${dstr(v.due_date)}</span>`)+
          td(badge(st.charAt(0).toUpperCase()+st.slice(1), TONE_FOR[st]))+
          td(`<div class="flex gap-1.5 justify-end">
              <button onclick="openPayHistory('${v.id}')" class="px-2.5 h-8 rounded-md bg-nature-100 hover:bg-nature-200 text-xs">History (${v.history.length})</button>
              ${outstanding(v)>0?btn('Record','primary',`onclick="openRecordPayment(&#39;${v.id}&#39;)"`):''}</div>`,'text-right');
      }))}
      <div class="px-4 py-3 border-t border-nature-200 text-xs text-nature-500 space-y-1">
        <p><code class="font-mono">paid</code> is the sum of the append-only history rows and <code class="font-mono">outstanding</code> is <code class="font-mono">total − paid</code> — neither is stored twice, matching the spec's generated column.</p>
        <p><strong>Assumption flagged:</strong> the spec lists <code class="font-mono">partial</code> and <code class="font-mono">overdue</code> as separate statuses but does not say which wins when a part-paid payment is past due. This shows <code class="font-mono">overdue</code>, as the more actionable of the two.</p>
      </div>`)}`;
};

/* ---------------- router / shell ---------------- */
function renderNav(active){
  // only render groups that have at least one screen this role may see
  document.getElementById('nav').innerHTML = NAV.map(g=>{
    const items = g.items.filter(it => can(it.cap));
    if (!items.length) return '';
    return `<div>
      <p class="px-2 mb-1.5 text-[11px] font-semibold uppercase tracking-wider text-nature-400">${g.group}</p>
      <div class="space-y-0.5">
        ${items.map(it=>`<a href="#${it.id}" class="flex items-center gap-2.5 px-2.5 h-9 rounded-md ${it.id===active?'bg-forest-50 text-forest-800 font-medium':'text-nature-600 hover:bg-nature-100'}">
          ${ico(it.icon, it.id===active?'text-forest-700':'text-nature-400')}<span class="truncate">${it.label}</span></a>`).join('')}
      </div></div>`;
  }).join('');
}
const ALL = NAV.flatMap(g=>g.items);
function route(){
  const id = (location.hash.replace('#','') || 'dashboard');
  let meta = ALL.find(i=>i.id===id) || ALL[0];
  renderNav(meta.id);
  document.getElementById('pageTitle').textContent = meta.label;
  document.getElementById('pageSub').textContent = meta.sub;

  // gate on direct hash access too — hiding the nav link alone is not authorization
  const body = can(meta.cap)
    ? (V[meta.id] || (()=>emptyState('Not built yet','This screen is part of the template scope.')))()
    : card(`<div class="p-4">${emptyState('Not available for your role',
        `“${meta.label}” needs the <strong>${(PERMS[meta.cap]||[]).map(r=>ROLE_LABEL[r]).join(' or ')}</strong> role. You are signed in as ${ROLE_LABEL[ROLE]}.`,
        `<a href="#team" class="inline-flex items-center rounded-md px-3 h-9 text-sm font-medium bg-forest-600 text-white">See permission tiers</a>`)}</div>`);

  document.getElementById('view').innerHTML = body;
  window.scrollTo(0,0);
  closeSidebar();
  document.getElementById('modal').hidden = true; // never leave a dialog open across a route change
}

window.saveGst = function(){
  const gstin = document.getElementById('gpGstin').value.trim().toUpperCase();
  const name  = document.getElementById('gpName').value.trim();
  const addr  = document.getElementById('gpAddr').value.trim();
  const code  = document.getElementById('gpCode').value.trim().toUpperCase();
  const existing = gstProfile();

  if (!name){ toast('Legal business name is required'); return; }
  if (!addr){ toast('Registered address is required'); return; }
  if (gstin && !GSTIN_RE.test(gstin)){
    document.getElementById('gpGstinMsg').innerHTML = '<span class="text-red-600">Not a valid GSTIN format (2 digits, 5 letters, 4 digits, letter, alphanumeric, Z, alphanumeric).</span>';
    toast('GSTIN format is invalid'); return;
  }
  if (!existing.short_code && !/^[A-Z0-9]{1,4}$/.test(code)){
    toast('Short code must be 1–4 letters or digits'); return;
  }
  STORE.set('gst', {
    legal_business_name:name, gstin, address:addr,
    home_state: document.getElementById('gpState').value,
    short_code: existing.short_code || code,          // immutable once set
    tax_scheme: document.getElementById('gpScheme').value,
    default_sac_code: document.getElementById('gpSac').value,
  });
  toast('GST profile saved'); route();
};

window.confirmIssue = function(){
  const p = gstProfile();
  const b = MOCK.bookings.find(x=>x.id===document.getElementById('ivBooking').value);
  const pos = document.getElementById('ivPos').value;
  const buyerGstin = document.getElementById('ivGstin').value.trim().toUpperCase();
  if (buyerGstin && !GSTIN_RE.test(buyerGstin)){ toast('Buyer GSTIN format is invalid'); return; }

  let margin = 0;
  if (p.tax_scheme === 'margin_18pct'){
    margin = Number(document.getElementById('ivMargin').value || 0);
    if (!(margin > 0)){ toast('Enter the margin for this booking'); return; }
    if (margin > b.amount){ toast('Margin cannot exceed the package price'); return; }
  }

  const t = computeTax({ scheme:p.tax_scheme, gross:b.amount, margin, placeOfSupply:pos, homeState:p.home_state });
  const now = new Date(), fy = financialYear(now);
  const inv = {
    id:'GI-' + Date.now(), bookingId:b.id,
    number: nextInvoiceNumber(p.short_code, fy), fy,
    date: now.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' }),
    // seller values are SNAPSHOTTED here — later profile edits must not rewrite this invoice
    seller_snapshot: { name:p.legal_business_name, gstin:p.gstin, address:p.address, state:p.home_state, scheme:p.tax_scheme, sac:p.default_sac_code },
    buyer_name:b.traveller, buyer_gstin:buyerGstin || null,
    place_of_supply:pos, gross:b.amount, margin,
    taxable:t.taxable, rate:t.rate, cgst:t.cgst, sgst:t.sgst, igst:t.igst, tax:t.tax, total:t.total, intra:t.intra,
    status:'issued', trip:b.trip,
  };
  STORE.set('invoices', invoices().concat(inv));
  document.getElementById('modal').hidden = true;
  toast('Invoice ' + inv.number + ' issued');
  if (location.hash.replace('#','') !== 'invoices') location.hash = 'invoices'; else route();
};

    </div>
    <div class="mt-5 pt-4 border-t border-nature-200 flex justify-end gap-2">
      ${btn('Cancel','ghost','data-close')}${btn('Record payment','primary',`onclick="confirmRecordPayment(&#39;${vpId}&#39;)"`)}
    </div>`);
};

window.confirmRecordPayment = function(vpId){
  const all = vendorPayments();
  const vp = all.find(v=>v.id===vpId);
  const amt = Number(document.getElementById('rpAmt').value || 0);
  if (!(amt > 0)){ toast('Enter an amount greater than zero'); return; }
  if (amt > outstanding(vp)){ toast(`Cannot exceed the outstanding ${INR(outstanding(vp))}`); return; }

  vp.history.push({ amount:round2(amt), paid_at:Date.now(), note:document.getElementById('rpNote').value.trim() || 'Payment recorded' });
  STORE.set('vendorPayments', all);
  const notify = document.getElementById('rpNotify').checked;
  document.getElementById('modal').hidden = true;

  if (notify){
    const before = vendorComms().length;
    fireVendorEvent('vendor_payment_completed', vp.trip);
    const sent = vendorComms().length - before;
    toast(`${INR(amt)} recorded · ${sent} vendor notification${sent===1?'':'s'} raised`);
  } else {
    toast(`${INR(amt)} recorded — ${INR(outstanding(vp))} still outstanding`);
  }
  route();
};

window.openPayHistory = function(vpId){
  const vp = vendorPayments().find(v=>v.id===vpId); if (!vp) return;
  openModal('Payment history — ' + vp.vendor, `
    ${vp.history.length ? `<div class="divide-y divide-nature-100">
      ${vp.history.slice().reverse().map(h=>`<div class="flex justify-between gap-4 py-2.5">
        <div><p class="font-medium tnum">${INR(h.amount)}</p><p class="text-xs text-nature-500">${h.note}</p></div>
        <span class="text-xs text-nature-500 whitespace-nowrap">${dstr(h.paid_at)}</span></div>`).join('')}
      </div>
      <div class="flex justify-between gap-4 pt-3 mt-2 border-t border-nature-300 text-sm">
        <span class="font-semibold">Paid</span><span class="font-semibold tnum">${INR(paidAmount(vp))} of ${INR(vp.total_amount)}</span></div>`
      : `<p class="text-sm text-nature-500 py-6 text-center">Nothing paid yet against this assignment.</p>`}
    <p class="text-xs text-nature-500 mt-3">This table is append-only — corrections are new rows, never edits, so the paid total always reconciles.</p>
    <div class="mt-5 pt-4 border-t border-nature-200 flex justify-end gap-2">${btn('Close','primary','data-close')}</div>`);
};

window.sendDueReminders = function(){
  const due = vendorPayments().filter(v=>vendorPayStatus(v)==='overdue' || dueSoon(v));
  if (!due.length){ toast('Nothing due — no reminders to send'); return; }
  const trips = [...new Set(due.map(v=>v.trip))];
  trips.forEach(t=>fireVendorEvent('pre_departure_reminder', t));
  toast(`Reminders raised for ${due.length} payment${due.length>1?'s':''} across ${trips.length} departure${trips.length>1?'s':''}`);
  route();
};

window.resetPhase1 = function(){ STORE.reset(); ROLE='owner'; roleSel.value='owner'; toast('Phase 1 demo data cleared'); route(); };

route();
</script>
</body>
