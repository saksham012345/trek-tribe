name: CI - API Build

on:
  push:
    paths:
      - 'services/api/**'
  pull_request:
    paths:
      - 'services/api/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trektribe
          POSTGRES_PASSWORD: trek-tribe-postgres-pass
          POSTGRES_DB: trektribe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trektribe -d trektribe"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://trektribe:trek-tribe-postgres-pass@localhost:5432/trektribe
      DIRECT_URL: postgresql://trektribe:trek-tribe-postgres-pass@localhost:5432/trektribe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
      - name: Generate JWT secret for tests
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> $GITHUB_ENV

      - name: Run tests
        run: npm test

      - name: Run TypeScript build
        run: npm run build

      - name: Build Docker image
        run: docker build -t trek-tribe-api:ci .
